    post:
      tags: [streams]
      operationId: createStreamPlaybackUrl
      summary: ライブ再生の署名付き URL
      description: |
        署名付きの HLS・RTMP play・WHEP の URL を返す。本文は省略できる（空なら Content-Type を見ない）。`ttl_secs` の既定は 300、上限は `--max-playback-ttl`。
      x-senca-scope: subscribe
