    get:
      tags: [recordings]
      operationId: exportRecordingMp4
      summary: MP4 の書き出し
      description: |
        録画中の録画と空の録画は 409 です。大きすぎる録画は 413（`PAYLOAD_TOO_LARGE`）です。応答には `Content-Disposition: attachment` が付きます。
        `start`・`end`（RFC 3339）で範囲を切り出せます（予約の録画では、予約の範囲と重なる部分）。始まりは直前のキーフレームまで広がります。
        時刻の形式の誤り、`end` が `start` 以前、未知のクエリは 400、範囲に録画が無ければ 409 です。
      x-senca-scope: recording:read
      parameters:
        - { name: start, in: query, required: false, schema: { $ref: '#/components/schemas/Timestamp' }, description: 書き出す範囲の始まり（RFC 3339） }
        - { name: end, in: query, required: false, schema: { $ref: '#/components/schemas/Timestamp' }, description: 書き出す範囲の終わり（RFC 3339） }
      responses:
        '200':
          description: MP4
          headers:
            Content-Disposition: { schema: { type: string } }
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
          content:
