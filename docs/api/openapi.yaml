        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ------------------------------------------------------------------ events
  /events:
    get:
      tags: [events]
      operationId: streamEvents
      summary: SSE によるイベントの購読
      description: |
        接続を開いたままイベントを送り続ける応答です。適用された制御コマンドをイベントとして、テナントで絞り込んで配信します。
        テナントに属さないイベント（`node.updated`・`stream.owner`・グリッドの `node.down`・`node.up`・`device.down`・`device.up`・`device.disabled`・
        `device.enabled`・`grid.decisions`）は、`node:admin` を持つ主体にだけ配信します。15 秒ごとにコメント行（keepalive）を送ります。

        - SSE の `id` は制御ログの位置（applied_index）、`event` はイベントの種類、`data` は `SseEventData` の JSON です。
        - 制御コマンドのイベント: `stream.created`・`stream.updated`・`stream.deleted`・`stream.owner`・`recording.updated`・`recording.deleted`・
          `schedule.created`・`schedule.updated`・`schedule.deleted`・`schedule.run`・`node.updated`・`input.updated`・`input.deleted`・
          `output.updated`・`output.deleted`・`secret.created`・`secret.deleted`・`pipeline.updated`・`pipeline.deleted`・
          `room.updated`（部屋の作成・自動作成・更新。`data: {auto}`）・`room.deleted`、
          `media_pipeline.updated`（メディアパイプラインの作成・更新。`data: {room, desired_state}`）・`media_pipeline.deleted`、グリッドの `node.down`・`node.up`・`device.*`・`grid.decisions`（`resource_id` は空、`data: {decisions}`）。
        - **部屋のイベント**（ADR-0015。合意ログには記録されず、部屋を配置したノードの購読者にだけ配信されます）: `room.started`（部屋が開かれた）・`room.stopped`・
          `room.connection.created`・`room.connection.updated`・`room.connection.destroyed`・`room.track.published`・`room.track.unpublished`・`room.spotlight.changed`。
          これらには SSE の `id` がありません（`Last-Event-ID` による再開の対象外で、取りこぼした分は通知なく失われます）。`data` には `event_id`（イベントの ID）と `node`（ノードの ID）が入り、
          `data.data` がイベントの内容です。テナントで絞り込み、`node:admin` であっても他のテナントのものは配信しません。
          部屋を削除したとき（`DELETE /rooms/{id}`・自動作成した部屋の自動削除）も、`room.stopped` と、そのとき切断した参加者の `room.connection.destroyed` が配信されます。
        - `Last-Event-ID` が現在の位置より前であれば、最初に `event: resync`（`id` は現在の位置、`data: {}`）を送ります（過去のイベントを保持しないため、必ず再同期になります）。
        - 購読の遅れでイベントを取りこぼした場合は、`event: resync`（`data: {}`）を送って接続を閉じます。

        制御コマンドのイベントの `data` に `event_id`・`generation` はありません（`event_id` に相当するのは SSE の `id` です）。`occurred_at` は送信した時刻です。過去のイベントの再送はありません。
        401・403 は他の API と同じ problem+json です。
      x-senca-scope: stream:read
      parameters:
        - name: Last-Event-ID
          in: header
          required: false
          description: 最後に受信したイベントの `id`（整数）。
          schema: { type: string }
      responses:
        '200':
          description: イベントのストリーム
          content:
            text/event-stream:
              schema:
                type: string
                description: |
                  例:
                  ```
                  event: stream.created
                  id: 42
                  data: {"type":"stream.created","resource_id":"...","occurred_at":"...","data":{"name":"studio-a"}}

                  event: room.connection.created
                  data: {"type":"room.connection.created","resource_id":"daily","event_id":"...","node":"...","occurred_at":"...","data":{"type":"connection.created","data":{"participant":{...}}}}
                  ```
              x-senca-event-data: { $ref: '#/components/schemas/SseEventData' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ------------------------------------------------------------------ streams
  /streams:
    post:
      tags: [streams]
      operationId: createStream
      summary: 配信定義の作成
      description: |
        `ingest.stream_key` はこの応答と `POST /streams/{id}/keys` の応答でだけ返します（再送に対する応答では `null` になり、`stream_key_redacted: true` が付きます）。
        name はテナント内で一意です（重複すると 409）。stream 数の上限（テナントあたり 1000）を超えると 403（`QUOTA_EXCEEDED`）です。
        本文には入力・出力・変換の指定はありません。push の入力は RTMP/SRT/WHIP で受信し、pull の入力と外部への出力は `POST /streams/{id}/inputs`・`/outputs`、変換は `/pipelines` で設定します。
        `captions` を指定すると、配信中に音声を外部の音声認識（と翻訳）サービスへ送り、ライブ HLS に WebVTT の字幕（`master.m3u8`・`sub_{lang}.m3u8`）を追加します。指定しなければ外部へは何も送りません。
      x-senca-scope: stream:write
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StreamCreate' }
      responses:
        '201':
          description: 作成しました
          headers:
            Location: { $ref: '#/components/headers/Location' }
            ETag: { $ref: '#/components/headers/ETagNotOnReplay' }
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
            Idempotency-Replayed: { $ref: '#/components/headers/Idempotency-Replayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Stream' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '500': { $ref: '#/components/responses/InternalError' }
    get:
      tags: [streams]
      operationId: listStreams
      summary: 配信の一覧
      x-senca-scope: stream:read
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: 配信の一覧
          headers: { X-Request-Id: { $ref: '#/components/headers/X-Request-Id' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StreamList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /streams/{id}:
    parameters:
      - $ref: '#/components/parameters/StreamId'
    get:
      tags: [streams]
      operationId: getStream
      summary: 望ましい状態（desired）と観測した状態（observed）の取得
      x-senca-scope: stream:read
      responses:
        '200': { $ref: '#/components/responses/StreamOk' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [streams]
      operationId: patchStream
      summary: 設定の更新
      description: |
        指定したフィールドだけを置き換えます（JSON Merge Patch の簡易版です。`snapshots: null` で静止画の方針を、`captions: null` で字幕の設定を削除します。`captions` は全体を置き換えます）。`desired_state: stopped` にすると publish を拒否します。
        成功すると 200 で、変更を反映した Stream を返します。
      x-senca-scope: stream:write
      parameters:
        - $ref: '#/components/parameters/IfMatchRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StreamPatch' }
      responses:
        '200': { $ref: '#/components/responses/StreamOk' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      tags: [streams]
      operationId: deleteStream
      summary: 配信の削除
      description: |
        stream とその予約を削除します（録画は削除しません）。publish 中であれば切断します。
        成功すると 204 です。
      x-senca-scope: stream:write
      parameters:
        - $ref: '#/components/parameters/IfMatchOptional'
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '500': { $ref: '#/components/responses/InternalError' }
