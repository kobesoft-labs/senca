        '409': { $ref: '#/components/responses/Conflict' }
  /streams/{id}/snapshot:
    parameters:
      - $ref: '#/components/parameters/StreamId'
    get:
      tags: [streams]
      operationId: getStreamSnapshot
      summary: 今の画（静止画）
      description: |
        配信中でなければ 409。キーフレーム待ち・映像のトラックが無いときも 409。復号はコーデック worker で行う。
        worker が動いていない・映像を復号できる装置が無い（H.264/H.265 はハードウェアだけ）ときは 503（`CAPACITY_UNAVAILABLE`、`retryable: false` で `Retry-After` は付かない）。
        worker が `UNSUPPORTED_CODEC`（royalty_free の方針など）を返すと 422、`INVALID_CONFIG` なら 400、それ以外の失敗は 500。
      x-senca-scope: stream:read
      parameters:
        - name: format
          in: query
          required: false
          schema: { type: string, enum: [jpeg, jpg, png], default: jpeg }
      responses:
        '200':
          description: 静止画
          headers: { X-Request-Id: { $ref: '#/components/headers/X-Request-Id' } }
          content:
            image/jpeg: { schema: { type: string, contentMediaType: image/jpeg } }
            image/png: { schema: { type: string, contentMediaType: image/png } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/UnprocessableEntity' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /streams/{id}/snapshots:
