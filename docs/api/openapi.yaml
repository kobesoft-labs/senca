  # ------------------------------------------------------------------ secrets
  /secrets:
    post:
      tags: [secrets]
      operationId: createSecret
      summary: 秘密値の登録
      description: |
        値はノードの鍵（AES-256-GCM）で暗号化して保存する。応答にも一覧にも値は出ない。参照は `ref`（`secret:{name}`）。
        name はテナント内で一意（重複は 409）、500 個まで（超えると 403 `QUOTA_EXCEEDED`）。値は 1〜8192 バイト。置き換えは「消して作り直す」（PATCH は無い）。
      x-senca-scope: tenant:admin
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SecretCreate' }
      responses:
        '201':
          description: 登録した（ETag は付かない）
          headers:
            Location: { $ref: '#/components/headers/Location' }
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
            Idempotency-Replayed: { $ref: '#/components/headers/Idempotency-Replayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Secret' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '500': { $ref: '#/components/responses/InternalError' }
    get:
      tags: [secrets]
      operationId: listSecrets
      summary: 秘密値の一覧（値は含まない）
      description: |
        **ページングは無い**（すべてを返し、`next_cursor` は常に null）。クエリは読まない（`limit`・`cursor`・知らないクエリも 400 にならない。他の一覧と違う、実装の不備）。
      x-senca-scope: tenant:admin
      responses:
        '200':
          description: 秘密値の一覧
          headers: { X-Request-Id: { $ref: '#/components/headers/X-Request-Id' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SecretList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /secrets/{id}:
    parameters:
      - $ref: '#/components/parameters/SecretId'
    delete:
      tags: [secrets]
      operationId: deleteSecret
      summary: 秘密値の削除
      description: |
        入力・出力の `credential_ref`、stream の `captions.asr_credential_ref`・`translate_credential_ref` が参照している秘密値は消せない（409）。`If-Match` は読まない。
      x-senca-scope: tenant:admin
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ------------------------------------------------------------------ pipelines
  /pipelines:
    post:
      tags: [pipelines]
      operationId: createPipeline
      summary: パイプラインの作成
      description: |
        グラフを検証して保存する（`desired_state` の既定は `stopped`）。検証の失敗:
        - グラフが読めない・部品の設定が不正・参照の誤り・方針（`royalty_free` の stream に H.264 など）・対応しないコーデック → 400（`INVALID_CONFIG`、`details.issues` に `PipelineIssue` の配列）
        - `source`・`sink` の stream がテナントに無い → 400（`INVALID_CONFIG`、`title` に stream の ID）
        - 装置が無い（H.264/H.265 のハードウェアが無い、セッション数の上限）→ 503（`CAPACITY_UNAVAILABLE`、`retryable: false`、`Retry-After` は付かない）
        name はテナント内で一意（重複は 409）、100 個まで（超えると 403 `QUOTA_EXCEEDED`）。コーデックの能力はこのノードのコーデック worker が報告するもの（worker が無ければ符号化・復号を含むグラフは 503）。
        - `placement` の誤り → 400（`INVALID_CONFIG`、`PlacementSpec`。グラフの検査の後）
        配置: `desired_state: running` のパイプラインはグリッドの仕事（`pipeline:{id}`）になり、配置係が割り当てたノードが動かす（`placement_status`。入力の stream を受けたノードを好む）。
        `placement.degrade` に縮退の段を書くと、資源（CPU・GPU のセッション）が足りないとき段を下げ、その段の部品（と、入力がすべて止まった下流）を外したグラフで動かす（`placement_status.state: degraded`）。
      x-senca-scope: stream:write
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PipelineCreate' }
      responses:
        '201':
          description: 作成した
          headers:
            Location: { $ref: '#/components/headers/Location' }
            ETag: { $ref: '#/components/headers/ETagNotOnReplay' }
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
            Idempotency-Replayed: { $ref: '#/components/headers/Idempotency-Replayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pipeline' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    get:
      tags: [pipelines]
      operationId: listPipelines
      summary: パイプラインの一覧
      x-senca-scope: stream:read
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: パイプラインの一覧
          headers: { X-Request-Id: { $ref: '#/components/headers/X-Request-Id' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PipelineList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /pipelines/{id}:
    parameters:
      - $ref: '#/components/parameters/PipelineId'
    get:
      tags: [pipelines]
      operationId: getPipeline
      summary: パイプラインの定義と実行の様子
      x-senca-scope: stream:read
      responses:
        '200': { $ref: '#/components/responses/PipelineOk' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [pipelines]
      operationId: patchPipeline
      summary: パイプラインの更新・開始・停止
      description: |
        `name`・`graph`・`desired_state`・`placement`（null で外す）を置き換える。`graph` は作成と同じ検査（400・503）。`desired_state: running` で開始、`stopped` で停止。
        `placement` を書かなくても、今の縮退の段は新しい `graph` で検査し直す（止める部品がグラフから消えれば 400）。
        更新すると generation が進み、動いていれば新しいグラフで作り直す（セッションを開き直す。シームレスな切り替えではない）。
        name はテナント内で一意（重複は 409）。注意: 本文の検査の後に `If-Match` を比べるので、古い `If-Match` と不正な本文では 400 が先に返る。
      x-senca-scope: stream:write
      parameters:
        - $ref: '#/components/parameters/IfMatchRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PipelinePatch' }
      responses:
        '200': { $ref: '#/components/responses/PipelineOk' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    delete:
      tags: [pipelines]
      operationId: deletePipeline
      summary: パイプラインの削除
      description: 動いていれば止めて消す。`If-Match` は読まない。
      x-senca-scope: stream:write
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /pipelines/{id}/validate:
    parameters:
      - $ref: '#/components/parameters/PipelineId'
    post:
      tags: [pipelines]
      operationId: validatePipeline
      summary: グラフの検証と計画（副作用なし）
      description: |
        本文が空なら保存したグラフを、本文があればそのグラフ（`PipelineGraph`、保存しない）を検証して計画を返す。失敗は作成と同じ 400・503。
        権限は `stream:read`（副作用が無いので）。
      x-senca-scope: stream:read
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PipelineGraph' }
      responses:
        '200':
          description: 検証に通った
          headers: { X-Request-Id: { $ref: '#/components/headers/X-Request-Id' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PipelineValidation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /pipelines/{id}/control:
    parameters:
      - $ref: '#/components/parameters/PipelineId'
    post:
      tags: [pipelines]
      operationId: controlPipeline
      summary: オペレーターの操作（シーンの切り替え・トランジション・フェーダーなど）
      description: |
        動いているパイプラインに `PipelineControl` を送り、返事を待つ（最長 15 秒）。合成・ミキサーへの操作は次の出力の刻みで反映する。
        - 本文の形が違う（知らない `op`・知らない項目）→ 400（`INVALID_REQUEST`）。`prepare`・`commit`・`rollback`（世代の操作）も 400（グラフの変更は `PATCH` で）。
        - パイプラインが動いていない（`stopped`・起動中・worker が無い）→ 409（`CONFLICT`）。
        - 操作が実行時に拒否された（知らない部品・シーン・レイヤーなど）も 409（`CONFLICT`、`title` に worker の誤り）。本来は 400 にすべきもの（実装の不備）。
      x-senca-scope: stream:write
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PipelineControl' }
      responses:
        '200':
          description: 反映した
          headers: { X-Request-Id: { $ref: '#/components/headers/X-Request-Id' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PipelineControlResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ------------------------------------------------------------------ rooms
  /rooms:
    post:
      tags: [rooms]
      operationId: createRoom
      summary: 部屋を作る
      description: |
        部屋を作る（ADR-0015）。`id` を省けば 24 文字の 16 進を作る。作った部屋はグリッドの仕事（`room:{id}`）になり、配置係が割り当てたノードの部屋の核が開く。
        検査の順: 本文の形（400 `INVALID_REQUEST`・415）→ `id`（1〜128 文字の英数字と `-_.:@`、400）→ `settings`（400）→ `metadata`（JSON で 8 KiB まで、400）
        → `placement`（400、`PlacementSpec`。`node` はノードの ID か名前で、応答では ID に直る。`degrade` は 400）→ 同じ ID の部屋（**どのテナントのものでも** 409）。
        テナントあたり 10000 部屋まで（超えると 403 `QUOTA_EXCEEDED`）。
        `settings` は部屋の核と同じ検査をする（形・範囲。違反は 400 で、`details.errors` に欄ごとの理由）。
      x-senca-scope: stream:write
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoomCreate' }
      responses:
        '201':
          description: 作成した
          headers:
            Location: { $ref: '#/components/headers/Location' }
            ETag: { $ref: '#/components/headers/ETag' }
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
            Idempotency-Replayed: { $ref: '#/components/headers/Idempotency-Replayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Room' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '500': { $ref: '#/components/responses/InternalError' }
    get:
      tags: [rooms]
      operationId: listRooms
      summary: 部屋の一覧
      description: テナントの部屋（参加トークンで自動に作った部屋を含む）。ID の昇順。
      x-senca-scope: stream:read
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: 部屋の一覧
          headers: { X-Request-Id: { $ref: '#/components/headers/X-Request-Id' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoomList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /rooms/{id}:
    parameters:
      - $ref: '#/components/parameters/RoomId'
    get:
      tags: [rooms]
      operationId: getRoom
      summary: 部屋の定義と置き場所
      description: 制御状態の部屋と配置の結果（`placement_status`）、つなぐ先（`signaling_url`）。参加者の数などの今の様子は `GET /rooms/{id}/participants`・`/stats`。他テナントの部屋は 404。
      x-senca-scope: stream:read
      responses:
        '200':
          description: 部屋
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Room' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [rooms]
      operationId: patchRoom
      summary: 部屋の更新
      description: |
        `settings`（**全体を置き換える**。書かなかった設定は既定値に戻る）・`metadata`・`placement`（null で外す）を変える。`settings`・`metadata` の null は「変えない」。
        検査の順: `If-Match`（428・412）→ 本文の形（400・415）→ 部屋があるか（404）→ 世代（412）→ 作成と同じ検査（400）。
        部屋の核に参加者がいる間は `e2ee`・`video_codec`・`audio_codec` を変えられない（409。部屋を置いたノードがこのノードのときだけ確かめる）。
        変更は部屋を置いたノードの部屋の核へ非同期に伝わる（スポットライトの変更は参加者の希望にも反映する）。
      x-senca-scope: stream:write
      parameters:
        - $ref: '#/components/parameters/IfMatchRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoomPatch' }
      responses:
        '200':
          description: 更新した部屋
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Room' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      tags: [rooms]
      operationId: deleteRoom
      summary: 部屋の削除
      description: |
        部屋を消す。部屋の核は参加者に `room_deleted` を送って切る（非同期）。`If-Match` は読まない。
        部屋のメディアパイプライン（`media-pipelines`）も消え、その子の合成のパイプライン・送り出しの出力も消す（書き出した stream・録画は残る）。
        このときメディアパイプラインの `media_pipeline.deleted` は流れない（`room.deleted` だけ）。
      x-senca-scope: stream:write
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /rooms/{id}/tokens:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string }, description: '部屋の ID（無ければ自動で作る。1〜128 文字の英数字と `-_.:@` でなければ 404）' }
    post:
      tags: [rooms]
      operationId: issueRoomToken
      summary: 参加トークンの発行
      description: |
        シグナリングの `connect.token` に渡す参加トークン（JWT、EdDSA（Ed25519）・`kid: senca-rooms-1`、`iss: senca`・`aud: senca-rooms`、`sub` はテナント、`room`・`role`・`client_id`・`bundle_id`・`metadata`・`permissions` の claim）。
        署名の鍵は制御状態から導くので、どのノードで発行しても全ノードで通る。`exp`・`iat`・`jti` が付く。
        **部屋が無ければ自動で作る**（`auto: true`、既定の設定。誰もいないまま `empty_timeout_secs` 経つと消える。SSE の `room.updated` の `data.auto: true`）。
        他テナントの部屋の ID は 404。
        検査の順: 本文の形（400・415）→ 部屋の ID の形（404）→ `ttl_secs`（10〜86400、400）→ `client_id`・`bundle_id`（1〜255 文字で制御文字を含めない、400）→ `metadata`（8 KiB まで、400）。
        署名の鍵がまだ無い（起動の直後）ときは 503（`retryable: true`）。
        Idempotency-Key の再送では `token` を伏せる（`token: null`・`token_redacted: true`）。
        仕様との差: senca-rooms 単体の発行（`RoomService::api_issue_token`）の `ttl_secs` の既定は 3600 で `expires_at` は UNIX 秒だが、ノードの API は既定 600 秒で RFC 3339。
      x-senca-scope: stream:write
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoomTokenRequest' }
      responses:
        '201':
          description: 発行した
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
            Idempotency-Replayed: { $ref: '#/components/headers/Idempotency-Replayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoomToken' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /rooms/{id}/participants:
    parameters:
      - $ref: '#/components/parameters/RoomId'
    get:
      tags: [rooms]
      operationId: listRoomParticipants
      summary: 参加者の一覧
      description: |
        部屋の核の参加者（このノードにつないだ参加者と、カスケードで他のノードにいる参加者 `signaling: remote`）。`connection_id` の昇順。
        部屋を置いたノードへ中継する（`rooms` タグの説明。置き場所が決まっていない・WebRTC が動いていないと 503、部屋の核が部屋をまだ開いていないと 404）。
        `next_cursor` は返した数が `limit` と同じときだけ入る（続きが無くても入ることがある）。続きが無ければ欄そのものが無い。
      x-senca-scope: stream:read
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: 参加者の一覧
          headers: { X-Request-Id: { $ref: '#/components/headers/X-Request-Id' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ParticipantList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /rooms/{id}/participants/{c}:
    parameters:
      - $ref: '#/components/parameters/RoomId'
      - $ref: '#/components/parameters/ConnectionId'
    get:
      tags: [rooms]
      operationId: getRoomParticipant
      summary: 参加者
      description: 参加者 1 人（`subscriptions` は受信の枠）。部屋を置いたノードへ中継する。参加していない接続は 404。
      x-senca-scope: stream:read
      responses:
        '200':
          description: 参加者
          headers: { X-Request-Id: { $ref: '#/components/headers/X-Request-Id' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Participant' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    patch:
      tags: [rooms]
      operationId: patchRoomParticipant
      summary: 参加者の metadata を変える
      description: |
        参加者の `metadata` を置き換え、部屋の全員に `notify {event: connection.updated}` を送る（SSE は `room.connection.updated`）。
        `If-Match` は読まない（参加者は世代を持たない）。このノードにつないだ参加者だけ（他のノードの参加者・参加していない接続は 404）。部屋を置いたノードへ中継する。
      x-senca-scope: stream:write
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ParticipantPatch' }
      responses:
        '200':
          description: 変えた参加者
          headers: { X-Request-Id: { $ref: '#/components/headers/X-Request-Id' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Participant' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    delete:
      tags: [rooms]
      operationId: disconnectRoomParticipant
      summary: 参加者を切る
      description: '参加者を部屋から外す（シグナリングの `disconnect {reason: kicked}`）。トークンは無効にならない（入り直せる）。このノードにつないだ参加者だけ（他は 404）。部屋を置いたノードへ中継する。'
      x-senca-scope: stream:write
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /rooms/{id}/messages:
    parameters:
      - $ref: '#/components/parameters/RoomId'
    post:
      tags: [rooms]
      operationId: postRoomMessage
      summary: 部屋・参加者へ送る
      description: |
        `label` が無ければシグナリングの `push {data}`（JSON のまま）、あれば DataChannel（そのラベルを開いている参加者へ、`data` は文字列）。
        `to`（connection_id の列）が空なら全員。`to` に部屋にいない接続があれば 404。`data` は JSON で 64 KiB まで、`label` は `#` で始まる（400）。
        応答の `delivered` は送った相手の数（誰もいなければ 0）。部屋を置いたノードへ中継する。
      x-senca-scope: stream:write
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RoomMessage' }
      responses:
        '200':
          description: 送った
          headers:
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
            Idempotency-Replayed: { $ref: '#/components/headers/Idempotency-Replayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RoomMessageResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /rooms/{id}/stats:
    parameters:
      - $ref: '#/components/parameters/RoomId'
    get:
      tags: [rooms]
      operationId: getRoomStats
      summary: 部屋の統計
      description: |
        部屋を置いたノードにつないだ参加者ごとの RTT・推定帯域・送受の量・送る層の bitrate・受けている層・クライアントの getStats の要約。
        カスケードで他のノードにいる参加者は含まない。部屋を置いたノードへ中継する。
      x-senca-scope: stream:read
      responses:
        '200':
          description: 統計
          headers: { X-Request-Id: { $ref: '#/components/headers/X-Request-Id' } }
