openapi: 3.1.0
info:
  title: SENCA 管理 API
  version: v1
  description: |
    SENCA ノードの管理 API です。配信・録画・入出力・パイプライン・部屋などの資源を HTTP と JSON で操作します。
    この文書は、ノードが実際に返す状態コードと応答の形を記述しています。

    ## 共通の決まり

    - base path は `/api/v1` です。本文は JSON（UTF-8）で、時刻は UTC の RFC 3339（`2026-10-25T00:00:00.000Z` の形）です。
    - **認証**: `/api/v1` 以下はすべて `Authorization: Bearer <token>` が必要です。値が `senca_` で始まれば API トークン、それ以外は JWT として扱います（JWT は `--jwks` を設定したときだけ使えます）。認証に失敗すると 401（`WWW-Authenticate: Bearer`）を返します。失敗の理由は応答に含めません。
    - **権限（scope）**: 各操作に必要な権限は拡張フィールド `x-senca-scope` に記載します（`null` は認証だけで使えることを表します）。`tenant:admin` は `node:admin` 以外のすべての権限を含みます。権限が足りなければ 403（`FORBIDDEN`）です。テナントは認証情報から決まり、本文に書いたテナントは使いません。他のテナントの資源は 404 になります。
    - **本文**: `Content-Type: application/json` 以外は 415 です。未知のフィールドは 400 です（スキーマでは `additionalProperties: false`）。HTTP 層の本文の上限は 1 MiB で、超えると text/plain の 413 を返して接続を閉じます。
    - **Idempotency-Key**: POST に付けると、24 時間は同じ応答（状態コード・本文・Location）を返します。再送に対する応答には `Idempotency-Replayed: true` が付きます。同じキーで別の要求（メソッド・パス・クエリ・本文の SHA-256 のいずれかが違う）を送ると 409（`IDEMPOTENCY_CONFLICT`）です。キーは 1〜255 文字の表示可能な ASCII で、違反すると 400 です。保存する応答からは秘密（`stream_key`・`token`・`secret`）を取り除き、代わりに `stream_key_redacted: true`・`token_redacted: true`（`secret_redacted: true`）を入れます。5xx の応答は保存しません。
    - **楽観的排他制御**: 応答の `ETag` は `"{generation}"` です。PATCH には `If-Match` が必須で、無ければ 428、形式が違うか古ければ 412 です。DELETE の `If-Match` は任意です（付けた場合は検査します）。
    - **一覧**: `limit`（1〜1000、既定 100）と `cursor`（前の応答の `next_cursor`）でページングします。並び順は ID の昇順です。知らないクエリパラメーターは 400 です。
    - **エラー**: エラーは `application/problem+json`（`Problem`）で返します。すべての応答に `X-Request-Id` と `Cache-Control: no-store` が付きます。`X-Request-Id` は、要求の `X-Request-Id` が 64 文字以内の英数字と `-_.` であればその値、そうでなければ生成した `req_...` です。
    - **405**: 定義済みの資源（`/capabilities`・`/nodes/...`・`/devices`・`/grid`・`/events`・`/streams/...`・`/recordings/...`・`/schedules/...`・`/tokens/...`・`/inputs/...`・`/outputs/...`・`/secrets/...`・`/pipelines/...`・`/rooms/...`・`/media-pipelines/...`）に、この文書に無いメソッド（HEAD を含む）を送ると 405（`METHOD_NOT_ALLOWED`）です。それ以外の未知のパスは 404 です。`x-senca-undefined-method-status` を参照してください。
    - **429**: 部品（`components.responses`）として定義していますが、現在どの操作も 429 は返しません（レート制限には未対応です）。
    - **422**: `GET /streams/{id}/snapshot` の復号でだけ返します。配信の作成・更新ではコーデックを検査しません（入力のコーデックは publish されるまで分からないためです）。対応しないコーデックは `POST /streams/{id}/plan` の結果の `code: UNSUPPORTED_CODEC` で分かります。
    - **5xx**: 制御状態の保存に失敗すると 500（`INTERNAL_ERROR`、`retryable: true`）です。再試行してよい 503 には `Retry-After: 1` が付きます。

    ## 現在対応していないもの

    - 非同期処理の operation 資源（`GET /operations/{id}`）はありません。202 の応答は対象の資源そのものを返します。
    - `POST /streams/{id}/sessions`、`DELETE /sessions/{id}`、`GET /inputs/{id}/reservations` はありません。
    - 入力（`/streams/{id}/inputs`・`/inputs/{id}`）は pull だけです（push は stream の鍵で受信します）。
    - 入力・出力・秘密値・パイプライン・部屋・メディアパイプラインの DELETE は `If-Match` を検査しません。
    - SSE は過去のイベントを保持しません（`Last-Event-ID` が現在の位置より前なら必ず `resync` になります）。
x-senca-undefined-method-status: 405
servers:
  - url: /api/v1
security:
  - bearer: []
tags:
  - name: system
    description: |
      能力・ノード・デバイス・グリッドの情報と、運用の操作です。
      **グリッド（ADR-0013）**: 各ノードは起動時に自分の資源（CPU・メモリ・帯域・GPU・キャプチャ機器・ラベル）を登録し、毎秒ハートビートをリーダーへ送ります。
      リーダー（単一ノードでは自分自身）のスケジューラーが、入力・出力・パイプラインなどから求めたワークロードをノードと装置に割り当てます。ワークロードは割り当てられたノードだけが実行します。
      資源ごとの配置の指定は `placement`（`PlacementSpec`）、配置の結果は `placement_status`（`PlacementStatus`）、全体の状態は `GET /grid` で確認できます。
  - name: streams
    description: 配信（stream）の定義・鍵・再生 URL・計画・静止画です。
  - name: recordings
    description: 録画・VOD・MP4 の書き出しです。
  - name: schedules
    description: 配信や録画の予約です。
  - name: tokens
    description: API トークンです（ADR-0005）。
  - name: io
    description: |
      入力（pull）と出力（push・PaaS 連携）です。定義は制御状態に保存され、ノードが非同期に実行します。
      実行の状態は応答の `status`（`IoStatus`）で確認します。接続先の IP アドレス（SSRF 対策）は接続のときに検査します。拒否された場合は `status.last_error` に表示されます（作成自体は 201 で成功します）。
  - name: secrets
    description: '秘密値です。値はノードの鍵で暗号化して保存され、API から読み出すことはできません。入力・出力からは `credential_ref: "secret:{name}"` で参照します。'
  - name: pipelines
    description: |
      パイプラインです。グラフは senca-pipeline の JSON 形式で記述します（`cargo doc -p senca-pipeline` の `Graph`）。
      作成・更新のたびにグラフを検証し（参照する stream がテナントのものか、コーデックの方針・装置）、`desired_state: running` であればコーデック worker で実行します。
  - name: rooms
    description: |
      リアルタイムの部屋です（ADR-0015、`docs/realtime/signaling.md` の 11 章）。SFU（転送だけを行い、変換はしません）を介して、参加者どうしが WebRTC で映像・音声を送り合います。
      - **部屋そのもの**（作成・取得・更新・削除）は制御状態の資源で、どのノードでも受け付けます。部屋の ID は**テナントをまたいで一意**です（他のテナントが使っている ID で作成すると 409、他のテナントの部屋を取得すると 404）。
      - **配置先**: 部屋はグリッドのワークロード（`room:{id}`）になり、スケジューラーが割り当てたノード（`placement_status.node`）で実行されます。`placement` は入力・出力と同じ形式です（`degrade` は 400）。
      - **現在の状態**（参加者・メッセージ・統計）は、部屋を配置したノードに問い合わせます。部屋が別のノードにあれば、要求を受けたノードが同じ認証情報のままそのノードの `/api/v1` へ転送し、
        応答（状態コード・本文・`ETag`）をそのまま返します（転送先からさらに転送はしません。その場合は 503）。配置先が決まる前（作成した直後）は 503（`retryable: true`）、
        このノードで WebRTC（`--webrtc-udp`）が動いていなければ 503（`retryable: false`）、部屋がまだ開かれていなければ 404 です。
      - **参加トークン**（`POST /rooms/{id}/tokens`）はどのノードでも発行できます（署名の鍵は制御状態から導出され、全ノードで同じです）。存在しない部屋を指定すると、部屋を自動で作成します（`auto: true`）。
      - **シグナリング（`/api/v1` の外）**: `GET /signaling`（WebSocket、RFC 6455、subprotocol `senca.rooms.v1` が必須）です。URL は部屋の `signaling_url`、
        またはトークン発行の応答の `signaling_url` です（`--public-http-url` の `http` を `ws` に、`https` を `wss` に替えて `/signaling` を付けたもの。別のノードに配置した部屋はそのノードの URL）。
        接続後の最初のメッセージ `connect {version: 1, room_id, token, role, ...}` で参加トークンを渡します（HTTP の `Authorization` は使いません）。
        メッセージの形式は `docs/realtime/signaling.md` を参照してください。部屋が別のノードにあれば `redirect {location}` を送って切断します（close code 4300）。
        WebRTC が動いていないノードは 503（text/plain）を返し、WebSocket のハンドシェイクの誤り（subprotocol が無いなど）にはハンドシェイク層の 4xx を返します。
      - 部屋で起きたこと（参加・退出・トラック・スポットライト）は `GET /events` に `room.*` として配信されます。
  - name: media-pipelines
    description: |
      部屋のメディアパイプラインです（ADR-0016、AWS Chime SDK Media Pipelines に相当）。部屋（`rooms`）の参加者を SENCA の stream に書き出し、
      録画・合成・外部への配信・文字起こしを 1 つの資源で指定します。定義は制御状態の資源で、どのノードでも受け付けます。

      | AWS（Chime SDK Media Pipelines） | SENCA |
      |---|---|
      | Media stream pipeline（Kinesis Video Streams へ） | 参加者ごとの stream（`export_participants`）。以後は通常の stream と同じく HLS・録画・出力・パイプラインで扱えます |
      | Media capture pipeline（会議を録画する） | `recording`（参加者ごとの stream と合成の stream の自動録画。保存先はノードのデータディレクトリ） |
      | Media concatenation pipeline | 録画の断片を 1 本にまとめるのは通常の録画の API です（`GET /recordings/{id}/export.mp4`・VOD の HLS） |
      | Media live connector pipeline（会議を RTMP へ） | `egress`（合成の stream の出力。RTMP・SRT・PaaS。`composite` が必要） |
      | Media insights pipeline（文字起こし・分析） | `captions`（参加者ごとの stream の字幕・翻訳、`CaptionSettings`。`export_participants` が必要） |

      - **実行するノード**: 部屋を配置したノード（`GET /rooms/{id}` の `placement_status.node`）が毎秒、部屋の参加者を確認して状態を合わせます。部屋が別のノードへ移れば、移動先のノードが引き継ぎます。
        `desired_state: running` のものだけを実行します。
      - **参加者ごとの stream**: 参加者（`client_id`、無ければ `connection_id`）ごとに stream を 1 本作り、送信された映像（最も品質の高い層）と音声を
        **再エンコードせずに**流します。`participants` が空なら全員、指定すればその `client_id` の参加者だけが対象です。カスケードで他のノードにいる参加者は書き出しません。
        stream の `metadata` には `media_pipeline`（メディアパイプラインの ID）と `room` が入ります。stream の名前は `{name}-{参加者}-{ID の先頭 6 文字}` です。
        publish 鍵では受信しません（使えない鍵が設定されています）。部屋の `video_codec` が H.264・H.265 なら `codec_profile: any`、それ以外は `royalty_free` です。
      - **合成**（`composite`）: 映像のある参加者を並べ（`grid` は格子状、`speaker` は最初の参加者を大きく表示）、音声はすべてミックスして 1 本の stream にする
        パイプライン（`pipelines` タグの資源。部屋を配置したノードに固定）を作ります。参加者は、その stream が流れ始めてからグラフに加えます。参加者が変わればグラフを更新します。
        映像のある参加者がいなければ、パイプラインは `stopped` です。
      - **子の資源の ID** はメディアパイプラインの ID から決まります（何度作り直しても同じ ID で、`artifacts` に表示されます）。合成のパイプラインと外部配信の出力は、
        通常の `GET /pipelines/{id}`・`GET /outputs/{id}` でも取得できます。
      - **後片付け**: メディアパイプラインや部屋を削除する、`stopped` にする、合成や外部配信の設定を変える、のいずれかを行うと、合成のパイプラインと外部配信の出力を削除します
        （実行を続ける場合は作り直します）。書き出した stream と録画は成果物として**残ります**（不要なら `DELETE /streams/{id}` で削除してください）。
      - SSE: 作成・更新では `media_pipeline.updated`（`data: {room, desired_state}`）、削除では `media_pipeline.deleted`（`data: {}`）が配信されます。
  - name: events
    description: SSE によるイベントの購読です。
  - name: playback
    description: |
      署名付きの再生パスです（`/api/v1` の外にあり、認証ヘッダーは不要です）。URL は `POST /streams/{id}/playback-url`・`POST /recordings/{id}/playback-url` が返します。
      署名は `HMAC-SHA256(playback_key, "{kind}/{id}/{exp}")` の先頭 16 バイトを base64url（パディングなし）にしたものです。署名が違う場合や期限切れの場合は 403（text/plain）です。応答には `Access-Control-Allow-Origin: *` が付きます。
      **クラスター**: 署名を確認した後、このノードにデータが無く（ライブなら配信を受信していない、VOD なら録画を持っていない）、データを持つノードの公開 URL（`media_addr`）が分かれば、307 でリダイレクトします（`Location: {media_addr}/s/{exp}/{sig}/...?{元のクエリ}`、本文は text/plain）。単一ノードでは 307 を返しません。
  - name: health
    description: 稼働確認です（`/api/v1` の外にあり、認証は不要です）。

paths:
  # ------------------------------------------------------------------ system
  /capabilities:
    get:
      tags: [system]
      operationId: getCapabilities
      summary: 対応するバージョン・コーデック・機能の一覧
      x-senca-scope: null
      responses:
        '200':
          description: 能力の一覧
          headers: { X-Request-Id: { $ref: '#/components/headers/X-Request-Id' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Capabilities' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /nodes:
    get:
      tags: [system]
      operationId: listNodes
      summary: ノードの一覧
      description: |
        ページングはありません（`items` だけを返し、`next_cursor` はありません）。クエリパラメーターは読みません。
      x-senca-scope: node:admin
      responses:
        '200':
          description: ノードの一覧
          headers: { X-Request-Id: { $ref: '#/components/headers/X-Request-Id' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NodeList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /nodes/{id}:
    parameters:
      - $ref: '#/components/parameters/NodeId'
    get:
      tags: [system]
      operationId: getNode
      summary: ノードの詳細
      x-senca-scope: node:admin
      responses:
        '200':
          description: ノード
          headers: { X-Request-Id: { $ref: '#/components/headers/X-Request-Id' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Node' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /nodes/{id}/drain:
    parameters:
      - $ref: '#/components/parameters/NodeId'
    post:
      tags: [system]
      operationId: drainNode
      summary: 新しい割り当ての停止（drain）
      description: |
        `draining: true` にしたノードを返します。本文は読みません。
        グリッドに登録されたノードであれば、グリッドの `draining` も変更します。新しいワークロードを配置しなくなり、配置済みのワークロードは移動できるものから別のノードへ移します（`reason.code: draining`）。
        drain 中のノードは、新しい配信者（RTMP・SRT・WHIP の publish）を拒否します（RTMP は `NetStream.Publish.Rejected`、SRT は拒否理由 1503、
        WHIP は drain 中でない別のノードの `/whip/...` へ 307。そのようなノードが無ければ 503）。接続済みの配信者・視聴者はそのまま維持されます。
      x-senca-scope: node:admin
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202': { $ref: '#/components/responses/NodeAccepted' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
  /nodes/{id}/undrain:
    parameters:
      - $ref: '#/components/parameters/NodeId'
    post:
      tags: [system]
      operationId: undrainNode
      summary: drain の解除
      description: '`draining: false` にしたノードを返します。グリッドに登録されたノードであれば、グリッドの `draining` も戻します（新しいワークロードを受け付けます）。'
      x-senca-scope: node:admin
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202': { $ref: '#/components/responses/NodeAccepted' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
  /devices:
    get:
      tags: [system]
      operationId: listDevices
      summary: ノードのハードウェア（GPU・キャプチャボード）
      description: 現在は、要求を受けたノード自身の装置だけを返します（コーデック worker に接続していなければ `devices` は空です）。
      x-senca-scope: node:admin
      responses:
        '200':
          description: デバイス
          headers: { X-Request-Id: { $ref: '#/components/headers/X-Request-Id' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Devices' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /grid:
    get:
      tags: [system]
      operationId: getGrid
      summary: グリッドの状態（ノードの資源・予約、ワークロードの割り当て）
      description: |
        スケジューラー（ADR-0013）が把握している状態です。ノードごとの登録内容（容量・GPU・キャプチャ機器・ラベル）と予約（割り当てたワークロードの要求の合計）、
        ワークロードごとの割り当て先・縮退の段階・配置できない理由を返します。テナントでは絞り込みません（`node:admin`）。クエリパラメーターは読みません。
        `last_heartbeat` は、応答したノードがスケジューラー（リーダー）のときだけ値が入ります。
      x-senca-scope: node:admin
      responses:
        '200':
          description: 'グリッド'
          headers: { X-Request-Id: { $ref: '#/components/headers/X-Request-Id' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Grid' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /nodes/{id}/devices/{dev}/disable:
    parameters:
      - $ref: '#/components/parameters/NodeId'
      - $ref: '#/components/parameters/DeviceId'
    post:
      tags: [system]
      operationId: disableDevice
      summary: 装置（GPU・キャプチャ機器）を手動で無効にする
      description: |
        グリッドの装置を手動で無効にします（`enabled: false`。計測による健全性 `healthy` とは別のフラグです）。無効にした装置を使うワークロードは、別の装置やノードへ
        移るか、縮退します。`placement.pin_policy: strict` でその装置に割り当てたワークロードは停止したままになります。本文は読みません。
        手動で無効にした状態は合意ログに記録され、ハートビートやノードの再登録では元に戻りません（`enable` で戻すまで続きます）。
        ノード（ID または名前）や装置がグリッドに無ければ 404 です。
      x-senca-scope: node:admin
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202': { $ref: '#/components/responses/DeviceHealthAccepted' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
  /nodes/{id}/devices/{dev}/enable:
    parameters:
      - $ref: '#/components/parameters/NodeId'
      - $ref: '#/components/parameters/DeviceId'
    post:
      tags: [system]
      operationId: enableDevice
      summary: 無効にした装置を有効に戻す
      description: |
        手動で無効にした装置を有効に戻します（`enabled: true`）。移動・縮退したワークロードは、クールダウンの後に戻ります（`reason.code: pin_returned`・`capacity_returned`）。本文は読みません。
        ノード（ID または名前）や装置がグリッドに無ければ 404 です。
      x-senca-scope: node:admin
