            application/json:
              schema: { $ref: '#/components/schemas/Output' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [io]
      operationId: patchOutput
      summary: 出力の更新
      description: |
        `url`・`credential_ref`（null で外す）・`enabled`・`options`・`placement`（null で外す）を置き換える。`protocol`・`provider`・`stream` は変えられない。
        `paas` の出力に `url` を書くと 400（スキームが合わない）。
      x-senca-scope: stream:write
      parameters:
        - $ref: '#/components/parameters/IfMatchRequired'
      requestBody:
