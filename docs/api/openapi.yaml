    get:
      tags: [streams]
      operationId: getStreamSnapshot
      summary: 現在の映像の静止画
      description: |
        配信中でなければ 409 です。キーフレームを待っている間や、映像のトラックが無いときも 409 です。復号はコーデック worker が行います。
        worker が動いていない場合や、映像を復号できる装置が無い場合（H.264/H.265 はハードウェアでのみ復号します）は 503（`CAPACITY_UNAVAILABLE`、`retryable: false` のため `Retry-After` は付きません）です。
        worker が `UNSUPPORTED_CODEC`（royalty_free の方針など）を返すと 422、`INVALID_CONFIG` を返すと 400、それ以外の失敗は 500 です。
      x-senca-scope: stream:read
