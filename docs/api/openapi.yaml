      x-senca-scope: tenant:admin
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ------------------------------------------------------------------ inputs / outputs
  /streams/{id}/inputs:
    parameters:
      - $ref: '#/components/parameters/StreamId'
    post:
      tags: [io]
      operationId: createInput
      summary: 入力（pull）の追加
      description: |
        外部から取得する入力（`rtmp_pull`・`rtsp_pull`・`srt_pull`・`hls_pull`）、またはこのノードのキャプチャ機器（`device`、`url: device:{機器 ID}`。機器は `GET /devices` の `capture`）を stream に追加します。push（配信者から接続する入力）は stream の鍵で受信するため、ここでは扱いません。
        検査の順序: 本文の形式（400・415）→ stream の有無（404）→ `protocol`（400）→ `url` のスキームと形式（400。資格情報 `user:pass@` は拒否するので `credential_ref` を使います）→ `credential_ref`（`secret:{name}` の形式と秘密値の有無、400）→ `options`（400）→ `placement`（400、`PlacementSpec`）。
        配置: `enabled: true` の入力はグリッドのワークロード（`input:{id}`）になり、スケジューラーが割り当てたノードが実行します（`placement_status`）。`placement.node` にはノードの ID か名前を指定でき、応答では ID に変換されます。`placement.degrade` は 400 です（パイプライン専用）。
        接続先の IP アドレス（リンクローカル・プライベートなど、`--egress-allow` で許可していないもの）は接続のときに拒否されます。このとき `status.state` は `error`/`backoff` になり、`status.last_error` に理由が表示されます（作成自体は 201 で成功します）。
        1 つの stream に追加できる入力は 4 つまでです（超えると 403 `QUOTA_EXCEEDED`）。`enabled: true` であればすぐに実行を始めます（応答の `status` は null か `starting` のことがあります）。
      x-senca-scope: stream:write
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InputCreate' }
      responses:
        '201':
          description: 作成しました
          headers:
            Location: { $ref: '#/components/headers/Location' }
            ETag: { $ref: '#/components/headers/ETagNotOnReplay' }
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
            Idempotency-Replayed: { $ref: '#/components/headers/Idempotency-Replayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Input' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '500': { $ref: '#/components/responses/InternalError' }
    get:
      tags: [io]
      operationId: listInputs
      summary: stream の入力の一覧
      x-senca-scope: stream:read
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: 入力の一覧
          headers: { X-Request-Id: { $ref: '#/components/headers/X-Request-Id' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InputList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /inputs/{id}:
    parameters:
      - $ref: '#/components/parameters/InputId'
    get:
      tags: [io]
      operationId: getInput
      summary: 入力の定義と実行の状態
      x-senca-scope: stream:read
      responses:
        '200':
          description: 入力
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Input' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [io]
      operationId: patchInput
      summary: 入力の更新
      description: |
        `url`・`credential_ref`（null で削除）・`enabled`・`options`・`placement`（null で削除）を置き換えます。`protocol` と `stream` は変更できません。作成と同じ検査を行います。
        更新すると実行中の接続を作り直します。`placement` を変更すると配置をやり直します（別のノードへ移ることがあります）。
      x-senca-scope: stream:write
      parameters:
        - $ref: '#/components/parameters/IfMatchRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IoPatch' }
      responses:
        '200':
          description: 更新後の入力
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Input' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      tags: [io]
      operationId: deleteInput
      summary: 入力の削除
      description: 実行中の接続を停止して定義を削除します。`If-Match` は検査しません。
      x-senca-scope: stream:write
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /streams/{id}/outputs:
    parameters:
      - $ref: '#/components/parameters/StreamId'
    post:
      tags: [io]
      operationId: createOutput
      summary: 出力（push・PaaS 連携）の追加
      description: |
        stream を外部へ送信する出力を追加します（`rtmp_push`・`srt_push`・`paas`）。配信が始まるまでは `status.state: waiting_input` です。
        - `rtmp_push`・`srt_push`: `url` が必要です（スキームの検査と、資格情報 `user:pass@` の拒否は入力と同じです）。RTMP の stream key は `url` の末尾か `credential_ref` で指定します。
        - `paas`: `provider`（`cloudflare_stream`・`aws_ivs`・`aws_medialive`）と `credential_ref`（その API の資格情報）が必要です。`url` は使いません。SENCA が外部サービスに作成した資源は `provider_resource` に記録され、出力を削除すると後片付けします。
        1 つの stream に追加できる出力は 16 個までです（超えると 403 `QUOTA_EXCEEDED`）。
        配置: `enabled: true` の出力はグリッドのワークロード（`output:{id}`）になり、スケジューラーが割り当てたノードが送信します（`placement_status`。指定が無ければ、配信を受信したノードを優先します）。`placement` の検査は入力と同じです（`degrade` は 400）。
        `whip_push`（外部の WHIP サーバーへの送信）には未対応です（400）。
      x-senca-scope: stream:write
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OutputCreate' }
      responses:
        '201':
          description: 作成しました
          headers:
            Location: { $ref: '#/components/headers/Location' }
            ETag: { $ref: '#/components/headers/ETagNotOnReplay' }
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
            Idempotency-Replayed: { $ref: '#/components/headers/Idempotency-Replayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Output' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '500': { $ref: '#/components/responses/InternalError' }
    get:
      tags: [io]
      operationId: listOutputs
      summary: stream の出力の一覧
      x-senca-scope: stream:read
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: 出力の一覧
          headers: { X-Request-Id: { $ref: '#/components/headers/X-Request-Id' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OutputList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /outputs/{id}:
    parameters:
      - $ref: '#/components/parameters/OutputId'
    get:
      tags: [io]
      operationId: getOutput
      summary: 出力の定義と実行の状態
      x-senca-scope: stream:read
      responses:
        '200':
          description: 出力
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Output' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [io]
      operationId: patchOutput
      summary: 出力の更新
      description: |
        `url`・`credential_ref`（null で削除）・`enabled`・`options`・`placement`（null で削除）を置き換えます。`protocol`・`provider`・`stream` は変更できません。
        `paas` の出力に `url` を指定すると 400 です（スキームが合わないため）。
      x-senca-scope: stream:write
      parameters:
        - $ref: '#/components/parameters/IfMatchRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IoPatch' }
      responses:
        '200':
          description: 更新後の出力
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Output' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      tags: [io]
      operationId: deleteOutput
      summary: 出力の削除
      description: |
        送信を停止して定義を削除します。`paas` で SENCA が外部サービスに作成した資源は後片付けします（後片付けに失敗してもログに記録し、定義は削除します）。`If-Match` は検査しません。
      x-senca-scope: stream:write
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ------------------------------------------------------------------ secrets
  /secrets:
    post:
      tags: [secrets]
      operationId: createSecret
      summary: 秘密値の登録
      description: |
        値はノードの鍵（AES-256-GCM）で暗号化して保存します。応答にも一覧にも値は含まれません。参照には `ref`（`secret:{name}`）を使います。
        name はテナント内で一意です（重複すると 409）。500 個まで登録できます（超えると 403 `QUOTA_EXCEEDED`）。値は 1〜8192 バイトです。値を変えるには、削除してから登録し直します（PATCH はありません）。
      x-senca-scope: tenant:admin
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SecretCreate' }
      responses:
        '201':
          description: 登録しました（ETag は付きません）
          headers:
            Location: { $ref: '#/components/headers/Location' }
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
            Idempotency-Replayed: { $ref: '#/components/headers/Idempotency-Replayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Secret' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '500': { $ref: '#/components/responses/InternalError' }
    get:
      tags: [secrets]
      operationId: listSecrets
      summary: 秘密値の一覧（値は含まない）
      description: |
        **ページングはありません**（すべてを返し、`next_cursor` は常に null です）。クエリパラメーターは読みません（他の一覧と違い、`limit`・`cursor`・未知のクエリパラメーターを付けても 400 になりません）。
      x-senca-scope: tenant:admin
      responses:
        '200':
          description: 秘密値の一覧
          headers: { X-Request-Id: { $ref: '#/components/headers/X-Request-Id' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SecretList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /secrets/{id}:
    parameters:
      - $ref: '#/components/parameters/SecretId'
    delete:
      tags: [secrets]
      operationId: deleteSecret
      summary: 秘密値の削除
      description: |
        入力・出力の `credential_ref`、stream の `captions.asr_credential_ref`・`translate_credential_ref` から参照されている秘密値は削除できません（409）。`If-Match` は検査しません。
      x-senca-scope: tenant:admin
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ------------------------------------------------------------------ pipelines
  /pipelines:
    post:
      tags: [pipelines]
      operationId: createPipeline
      summary: パイプラインの作成
      description: |
        グラフを検証して保存します（`desired_state` の既定は `stopped`）。検証に失敗した場合:
        - グラフを解釈できない、処理ノードの設定が不正、参照の誤り、方針違反（`royalty_free` の stream に H.264 など）、対応しないコーデック → 400（`INVALID_CONFIG`。`details.issues` に `PipelineIssue` の配列）
        - `source`・`sink` の stream がテナントに無い → 400（`INVALID_CONFIG`。`title` に stream の ID）
        - 装置が無い（H.264/H.265 のハードウェアが無い、セッション数が上限に達している）→ 503（`CAPACITY_UNAVAILABLE`、`retryable: false`。`Retry-After` は付きません）
        name はテナント内で一意です（重複すると 409）。100 個まで作成できます（超えると 403 `QUOTA_EXCEEDED`）。コーデックの能力は、このノードのコーデック worker が報告したものです（worker が無ければ、エンコード・デコードを含むグラフは 503）。
        - `placement` の誤り → 400（`INVALID_CONFIG`、`PlacementSpec`。グラフの検査の後に検査します）
        配置: `desired_state: running` のパイプラインはグリッドのワークロード（`pipeline:{id}`）になり、スケジューラーが割り当てたノードが実行します（`placement_status`。入力の stream を受信したノードを優先します）。
        `placement.degrade` に縮退の段階を指定すると、資源（CPU・GPU のセッション）が足りないときに段階を下げ、その段階で指定した処理ノード（と、入力がすべて止まった下流の処理ノード）を外したグラフで実行します（`placement_status.state: degraded`）。
      x-senca-scope: stream:write
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PipelineCreate' }
      responses:
        '201':
          description: 作成しました
          headers:
            Location: { $ref: '#/components/headers/Location' }
            ETag: { $ref: '#/components/headers/ETagNotOnReplay' }
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
            Idempotency-Replayed: { $ref: '#/components/headers/Idempotency-Replayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Pipeline' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    get:
      tags: [pipelines]
      operationId: listPipelines
      summary: パイプラインの一覧
      x-senca-scope: stream:read
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: パイプラインの一覧
          headers: { X-Request-Id: { $ref: '#/components/headers/X-Request-Id' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PipelineList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /pipelines/{id}:
    parameters:
      - $ref: '#/components/parameters/PipelineId'
    get:
      tags: [pipelines]
      operationId: getPipeline
      summary: パイプラインの定義と実行の状態
      x-senca-scope: stream:read
      responses:
        '200': { $ref: '#/components/responses/PipelineOk' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [pipelines]
      operationId: patchPipeline
      summary: パイプラインの更新・開始・停止
      description: |
        `name`・`graph`・`desired_state`・`placement`（null で削除）を置き換えます。`graph` には作成と同じ検査を行います（400・503）。`desired_state: running` で開始し、`stopped` で停止します。
        `placement` を指定しなくても、現在の縮退の段階を新しい `graph` で検査し直します（停止する処理ノードがグラフに無くなっていれば 400）。
        更新すると generation が増え、実行中であれば新しいグラフで作り直します（セッションを開き直すため、シームレスな切り替えではありません）。
        name はテナント内で一意です（重複すると 409）。本文の検査は `If-Match` の比較より先に行うため、古い `If-Match` と不正な本文を同時に送ると 400 が返ります。
      x-senca-scope: stream:write
      parameters:
        - $ref: '#/components/parameters/IfMatchRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PipelinePatch' }
      responses:
        '200': { $ref: '#/components/responses/PipelineOk' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '500': { $ref: '#/components/responses/InternalError' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
    delete:
      tags: [pipelines]
      operationId: deletePipeline
      summary: パイプラインの削除
      description: 実行中であれば停止してから削除します。`If-Match` は検査しません。
      x-senca-scope: stream:write
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /pipelines/{id}/validate:
    parameters:
      - $ref: '#/components/parameters/PipelineId'
    post:
      tags: [pipelines]
      operationId: validatePipeline
      summary: グラフの検証と計画（副作用なし）
      description: |
        本文が空であれば保存済みのグラフを、本文があればそのグラフ（`PipelineGraph`。保存はしません）を検証し、計画を返します。失敗時の応答は作成と同じ 400・503 です。
        副作用が無いため、必要な権限は `stream:read` です。
      x-senca-scope: stream:read
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PipelineGraph' }
      responses:
        '200':
          description: 検証に成功しました
          headers: { X-Request-Id: { $ref: '#/components/headers/X-Request-Id' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PipelineValidation' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '503': { $ref: '#/components/responses/ServiceUnavailable' }
  /pipelines/{id}/control:
    parameters:
      - $ref: '#/components/parameters/PipelineId'
    post:
      tags: [pipelines]
      operationId: controlPipeline
      summary: オペレーター操作（シーンの切り替え・トランジション・フェーダーなど）
      description: |
        実行中のパイプラインに `PipelineControl` を送り、応答を待ちます（最長 15 秒）。合成・ミキサーへの操作は、次の出力フレームから反映されます。
        - 本文の形式が違う（未知の `op`・未知の項目）→ 400（`INVALID_REQUEST`）。`prepare`・`commit`・`rollback`（世代の操作）も 400 です（グラフの変更には `PATCH` を使います）。
        - パイプラインが実行中でない（`stopped`・起動中・worker が無い）→ 409（`CONFLICT`）。
        - 実行時に操作が拒否された（未知の処理ノード・シーン・レイヤーなど）場合も 409（`CONFLICT`。`title` に worker のエラー）です。
      x-senca-scope: stream:write
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PipelineControl' }
      responses:
        '200':
          description: 反映しました
          headers: { X-Request-Id: { $ref: '#/components/headers/X-Request-Id' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PipelineControlResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '500': { $ref: '#/components/responses/InternalError' }
  /pipelines/{id}/snapshots:
    parameters:
      - $ref: '#/components/parameters/PipelineId'
    get:
      tags: [pipelines]
      operationId: listPipelineSnapshots
      summary: 板書の変化の静止画の一覧
      description: '`snapshot_on_change` が保存した静止画（`reason: board_change`、`node` に部品の ID）。撮った時刻の順。パイプラインを動かしているノードのものだけ。'
      x-senca-scope: stream:read
      responses:
        '200':
          description: 静止画の一覧
          headers: { X-Request-Id: { $ref: '#/components/headers/X-Request-Id' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SnapshotList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /pipelines/{id}/snapshots/{sid}:
    parameters:
      - $ref: '#/components/parameters/PipelineId'
      - $ref: '#/components/parameters/SnapshotId'
    get:
      tags: [pipelines]
      operationId: getPipelineSnapshotById
      summary: 板書の変化の静止画
      x-senca-scope: stream:read
      responses:
        '200':
          description: 静止画
          headers: { X-Request-Id: { $ref: '#/components/headers/X-Request-Id' } }
          content:
            image/jpeg: { schema: { type: string, contentMediaType: image/jpeg } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [pipelines]
      operationId: deletePipelineSnapshot
      summary: 板書の変化の静止画の削除
      x-senca-scope: stream:write
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ------------------------------------------------------------------ rooms
  /rooms:
    post:
      tags: [rooms]
      operationId: createRoom
      summary: 部屋の作成
      description: |
        部屋を作成します（ADR-0015）。`id` を省略すると 24 文字の 16 進数を生成します。作成した部屋はグリッドのワークロード（`room:{id}`）になり、スケジューラーが割り当てたノードで開かれます。
        検査の順序: 本文の形式（400 `INVALID_REQUEST`・415）→ `id`（1〜128 文字の英数字と `-_.:@`、400）→ `settings`（400）→ `metadata`（JSON で 8 KiB まで、400）
        → `placement`（400、`PlacementSpec`。`node` にはノードの ID か名前を指定でき、応答では ID に変換されます。`degrade` は 400）→ 同じ ID の部屋（**どのテナントのものでも** 409）。
        テナントあたり 10000 部屋まで作成できます（超えると 403 `QUOTA_EXCEEDED`）。
        `settings` には、部屋を開くときと同じ検査（形式・範囲）を行います。違反すると 400 で、`details.errors` に項目ごとの理由が入ります。
      x-senca-scope: stream:write
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
