openapi: 3.1.0
info:
  title: SENCA 管理 API
  version: v1
  description: |
    SENCA ノードの管理 API（仕様 SENCA-SRS-001 10 章、REQ-002）。この文書は **実装（`crates/senca-node/src/api/`）の挙動** を書いたもの。
    仕様と違うところは各操作の説明に「仕様との差」として書く。`tools/interop/openapi.sh` が、実装の経路表との一致と、実際の応答がここに書いた状態コード・形に合うことを確かめる。

    ## 共通の決まり

    - base path は `/api/v1`。本文は JSON（UTF-8）、時刻は UTC の RFC 3339（`2026-10-25T00:00:00.000Z` の形）。
    - **認証**: すべての `/api/v1` は `Authorization: Bearer <token>` が要る。値が `senca_` で始まれば API トークン、それ以外は JWT（`--jwks` を設定したときだけ）。失敗は 401（`WWW-Authenticate: Bearer`）。失敗の理由は応答に出さない。
    - **権限**: 各操作に要る権限を拡張 `x-senca-scope` に書く（`null` は認証だけ）。`tenant:admin` は `node:admin` 以外のすべてを含む。足りなければ 403（`FORBIDDEN`）。テナントは認証の文脈から決まり、本文のテナントは使わない。他テナントの資源は 404。
    - **本文**: `Content-Type: application/json` 以外は 415。未知のフィールドは 400（`deny_unknown_fields`、スキーマでは `additionalProperties: false`）。HTTP 層の本文上限は 1 MiB（超えると HTTP 層が text/plain の 413 を返し、接続を閉じる）。
    - **Idempotency-Key**: POST に付けると 24 時間、同じ答え（状態コード・本文・Location）を返す。再送の応答には `Idempotency-Replayed: true` が付く。同じ鍵で別の要求（メソッド・パス・クエリ・本文の SHA-256 が違う）は 409（`IDEMPOTENCY_CONFLICT`）。鍵は 1〜255 文字の表示可能 ASCII（違えば 400）。覚える本文からは秘密（`stream_key`・`token`・`secret`）を消し、代わりに `stream_key_redacted: true`・`token_redacted: true`（`secret_redacted: true`）を入れる。5xx は覚えない。
    - **楽観的排他**: 応答の `ETag` は `"{generation}"`。PATCH は `If-Match` 必須（無いと 428、形が違う・古いと 412）。DELETE の `If-Match` は任意（付ければ検査）。
    - **一覧**: `limit`（1〜1000、既定 100）と `cursor`（前の応答の `next_cursor`）。順序は ID の昇順。知らないクエリは 400。
    - **エラー**: `application/problem+json`（`Problem`）。すべての応答に `X-Request-Id`（要求の `X-Request-Id` が 64 文字以内の英数字と `-_.` ならそれを、違えば生成した `req_...`）と `Cache-Control: no-store` が付く。
    - **405**: 経路表にある資源（`/capabilities`・`/nodes/...`・`/devices`・`/grid`・`/events`・`/streams/...`・`/recordings/...`・`/schedules/...`・`/tokens/...`・`/inputs/...`・`/outputs/...`・`/secrets/...`・`/pipelines/...`・`/rooms/...`・`/media-pipelines/...`）に、ここに書いていないメソッド（HEAD を含む）を送ると 405（`METHOD_NOT_ALLOWED`）。それ以外の知らないパスは 404。`x-senca-undefined-method-status` を参照。
    - **429**: 部品（`components.responses`）には定義するが、今の実装はどの操作でも返さない（レート制限は未実装）。
    - **422**: `GET /streams/{id}/snapshot` の復号でだけ返す。配信の作成・更新ではコーデックを検査しない（入力のコーデックは publish まで分からない）。不適合は `POST /streams/{id}/plan` の結果の `code: UNSUPPORTED_CODEC` で知らせる。
    - **5xx**: 制御状態の永続化に失敗すると 500（`INTERNAL_ERROR`、`retryable: true`）。再試行してよい 503 には `Retry-After: 1` が付く。

    ## 仕様との主な差（まとめ）

    - 非同期処理の operation 資源（`GET /operations/{id}`）は無い。202 の応答は対象資源そのものを返す。
    - `PATCH /streams/{id}` は 202 ではなく 200（その場で反映した資源を返す）。`DELETE /streams/{id}` は 202 ではなく 204。
    - `POST /streams/{id}/sessions`、`DELETE /sessions/{id}`、`GET /inputs/{id}/reservations` は未実装。
    - 入力（`/streams/{id}/inputs`・`/inputs/{id}`）は pull だけ（push は stream の鍵で受ける）。
    - 入力・出力・秘密値・パイプライン・部屋・メディアパイプラインの DELETE は `If-Match` を読まない（付けても検査しない）。
    - SSE は再送の保持を持たない（`Last-Event-ID` が今の位置より前なら必ず `resync`）。
x-senca-undefined-method-status: 405
servers:
  - url: /api/v1
security:
  - bearer: []
tags:
  - name: system
    description: |
      能力・ノード・デバイス・グリッド（運用）。
      **グリッド（ADR-0013）**: 各ノードは起動時に資源（CPU・メモリ・帯域・GPU・キャプチャ機器・ラベル）を申告し、毎秒の心拍をリーダーへ送る。
      リーダー（単一ノードでは自分）の配置係が、入力・出力・パイプラインから導いた仕事をノード・装置に割り当てる。仕事は割り当てられたノードだけが動かす。
      資源ごとの配置の指定は `placement`（`PlacementSpec`）、結果は `placement_status`（`PlacementStatus`）、全体の様子は `GET /grid`。
  - name: streams
    description: 配信（stream）の定義・鍵・再生 URL・計画・静止画。
  - name: recordings
    description: 録画・VOD・MP4 書き出し。
  - name: schedules
    description: 予約（REQ-002）。
  - name: tokens
    description: API トークン（ADR-0005、仕様 10.2 の表にない追加）。
  - name: io
    description: |
      入力（pull）と出力（push・PaaS 連携）。仕様 10.2。定義は制御状態に保存し、ノードの中の係（`io.rs`）が非同期に実行する。
      実行の様子は応答の `status`（`IoStatus`）で見る。宛先の IP（SSRF の防止）は接続時に検査し、拒否は `status.last_error` に出る（作成は 201 で通る）。
  - name: secrets
    description: '秘密値（仕様 10.2「credentials は secret reference」）。値はノードの鍵で暗号化して保存し、API からは読めない。入力・出力は `credential_ref: "secret:{name}"` で参照する。'
  - name: pipelines
    description: |
      パイプライン（REQ-002・REQ-005・REQ-008）。グラフは senca-pipeline の JSON（`crates/senca-pipeline/src/model.rs` の `Graph`、`cargo doc -p senca-pipeline`）。
      作成・更新のたびに検証し（参照する stream がテナントのものか、方針・装置）、`desired_state: running` ならコーデック worker のセッションで動かす。
  - name: rooms
    description: |
      リアルタイムの部屋（ADR-0015、`docs/realtime/signaling.md` の 11 章）。SFU（転送だけ、変換しない）で参加者どうしが WebRTC で送り合う。
      - **部屋そのもの**（作る・読む・変える・消す）は制御状態の資源で、どのノードでも受ける。部屋の ID は**テナントをまたいで一意**（他のテナントが使っている ID で作ると 409、他のテナントの部屋を読むと 404）。
      - **置き場所**: 部屋はグリッドの仕事（`room:{id}`）になり、配置係が割り当てたノード（`placement_status.node`）の部屋の核が動かす。`placement` は入力・出力と同じ（`degrade` は 400）。
      - **今の様子**（参加者・メッセージ・統計）は部屋を置いたノードの部屋の核に問い合わせる。別のノードにあれば、受けたノードが同じ認証のまま
        そのノードの `/api/v1` へ中継し、応答（状態コード・本文・`ETag`）をそのまま返す（中継の中継はしない: 503）。置き場所が決まる前（作った直後）は 503（`retryable: true`）、
        このノードで WebRTC（`--webrtc-udp`）が動いていなければ 503（`retryable: false`）、部屋の核がまだ部屋を開いていなければ 404。
      - **参加トークン**（`POST /rooms/{id}/tokens`）はどのノードでも発行できる（署名の鍵は制御状態から導く、全ノードで同じ）。無い部屋を頼むと部屋を自動で作る（`auto: true`）。
      - **シグナリング（`/api/v1` の外）**: `GET /signaling`（WebSocket、RFC 6455、subprotocol `senca.rooms.v1` が必須）。URL は部屋の `signaling_url`・
        トークンの応答の `signaling_url`（`--public-http-url` の `http`→`ws`・`https`→`wss` に `/signaling` を付けたもの、別のノードに置いた部屋はそのノードの URL）。
        つないだ後の最初の message `connect {version: 1, room_id, token, role, ...}` で参加トークンを渡す（HTTP の `Authorization` は使わない）。
        message の形は `docs/realtime/signaling.md`。部屋が別のノードにあれば `redirect {location}` を送って閉じる（close code 4300）。
        WebRTC が動いていないノードは 503（text/plain）、WebSocket の握手の誤り（subprotocol が無いなど）は握手の層の 4xx を返す。
      - 部屋の核の出来事（参加・退出・トラック・スポットライト）は `GET /events` に `room.*` として流れる。
  - name: media-pipelines
    description: |
      部屋のメディアパイプライン（ADR-0016、AWS Chime SDK Media Pipelines 相当）。部屋（`rooms`）の参加者を SENCA の stream に書き出し、
      録画・合成・送り出し・文字起こしを 1 つの資源で指定する。定義は制御状態の資源で、どのノードでも受ける。

      | AWS（Chime SDK Media Pipelines） | SENCA |
      |---|---|
      | Media stream pipeline（Kinesis Video Streams へ） | 参加者ごとの stream（`export_participants`）。以後は普通の stream と同じく HLS・録画・出力・パイプラインに乗る |
      | Media capture pipeline（会議を S3 へ録る） | `recording`（参加者ごとの stream と合成の stream の自動録画。置き場所は録画の設定どおり、ローカル・S3 互換） |
      | Media concatenation pipeline | 録画の断片を 1 本にまとめるのは普通の録画の API（`GET /recordings/{id}/export.mp4`・VOD の HLS） |
      | Media live connector pipeline（会議を RTMP へ） | `egress`（合成の stream の出力。RTMP・SRT・PaaS。`composite` が要る） |
      | Media insights pipeline（文字起こし・分析） | `captions`（参加者ごとの stream の字幕・翻訳、`CaptionSettings`。`export_participants` が要る） |

      - **動かす係**: 部屋を置いたノード（`GET /rooms/{id}` の `placement_status.node`）の係が毎秒、部屋の参加者を見て突き合わせる（部屋が別のノードへ移れば、移った先の係が引き継ぐ）。
        `desired_state: running` のものだけ動かす。
      - **参加者ごとの stream**: 参加者（`client_id`、無ければ `connection_id`）ごとに stream を 1 本作り、送ってきた映像（いちばん良い層）と音声を
        **再符号化せずに** 流す。`participants` が空なら全員、書けばその `client_id` の参加者だけ。カスケードで他のノードにいる参加者は書き出さない。
        stream の `metadata` に `media_pipeline`（メディアパイプラインの ID）と `room` が入る。stream の名前は `{name}-{参加者}-{ID の頭 6 文字}`。
        publish 鍵では受けない（使えない鍵を入れてある）。部屋の `video_codec` が H.264・H.265 なら `codec_profile: any`、他は `royalty_free`。
      - **合成**（`composite`）: 映像のある参加者を並べ（`grid` は格子、`speaker` は最初の参加者を大きく）、音声はすべて混ぜて 1 本の stream にする
        パイプライン（`pipelines` タグの資源、部屋を置いたノードに固定）を作る。参加者の stream が流れ始めてから図に入れ、参加者が変われば図を直す。
        映像のある参加者がいなければパイプラインは `stopped`。
      - **子の資源の ID** はメディアパイプラインの ID から決まる（何度作っても同じ。`artifacts` に出る）。合成のパイプライン・送り出しの出力は
        普通の `GET /pipelines/{id}`・`GET /outputs/{id}` でも読める。
      - **片付け**: メディアパイプラインや部屋を消す、`stopped` にする、合成・送り出しを変えると、合成のパイプラインと送り出しの出力を消す
        （動かすなら係が作り直す）。書き出した stream と録画は成果物として**残る**（要らなければ `DELETE /streams/{id}` で消す）。
      - SSE: 作成・更新は `media_pipeline.updated`（`data: {room, desired_state}`）、削除は `media_pipeline.deleted`（`data: {}`）。
  - name: events
    description: SSE のイベント購読（仕様 10.5）。
  - name: playback
    description: |
      署名付きの再生パス（`/api/v1` の外、認証ヘッダーなし）。URL は `POST /streams/{id}/playback-url`・`POST /recordings/{id}/playback-url` が返す。
      署名は `HMAC-SHA256(playback_key, "{kind}/{id}/{exp}")` の先頭 16 バイトを base64url（パディングなし）にしたもの。署名違い・期限切れは 403（text/plain）。応答には `Access-Control-Allow-Origin: *` が付く。
      **分散（クラスター）**: 署名を確かめた後、このノードにデータが無く（ライブは配信を受けていない、VOD は録画を持っていない）、持っているノードの公開 URL（`media_addr`）が分かれば 307 で案内する（`Location: {media_addr}/s/{exp}/{sig}/...?{元のクエリ}`、本文は text/plain）。単一ノードでは返さない。
  - name: health
    description: 稼働確認（`/api/v1` の外、認証なし）。

paths:
  # ------------------------------------------------------------------ system
  /capabilities:
    get:
      tags: [system]
      operationId: getCapabilities
      summary: 対応版・コーデック・機能の一覧
      x-senca-scope: null
      responses:
        '200':
          description: 能力
          headers: { X-Request-Id: { $ref: '#/components/headers/X-Request-Id' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Capabilities' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /nodes:
    get:
      tags: [system]
      operationId: listNodes
      summary: ノードの一覧
      description: |
        仕様との差: ページングは無い（`items` だけ、`next_cursor` なし）。クエリは読まない。
      x-senca-scope: node:admin
      responses:
        '200':
          description: ノードの一覧
          headers: { X-Request-Id: { $ref: '#/components/headers/X-Request-Id' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NodeList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /nodes/{id}:
    parameters:
      - $ref: '#/components/parameters/NodeId'
    get:
      tags: [system]
      operationId: getNode
      summary: ノードの詳細
      x-senca-scope: node:admin
      responses:
        '200':
          description: ノード
          headers: { X-Request-Id: { $ref: '#/components/headers/X-Request-Id' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Node' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /nodes/{id}/drain:
    parameters:
      - $ref: '#/components/parameters/NodeId'
    post:
      tags: [system]
      operationId: drainNode
      summary: 新規割当の停止（drain）
      description: |
        `draining: true` にしたノードを返す。本文は読まない。仕様は 202 と operation 資源だが、実装は 202 で Node をそのまま返す。
        グリッドに登録されたノードなら、グリッドの `draining` も変える: 新しい仕事を置かず、置いてある仕事は移せるものから別のノードへ移す（`reason.code: draining`）。
      x-senca-scope: node:admin
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202': { $ref: '#/components/responses/NodeAccepted' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
  /nodes/{id}/undrain:
    parameters:
      - $ref: '#/components/parameters/NodeId'
    post:
      tags: [system]
      operationId: undrainNode
      summary: drain の解除
      description: '`draining: false` にしたノードを返す。グリッドに登録されたノードなら、グリッドの `draining` も戻す（新しい仕事を受ける）。'
      x-senca-scope: node:admin
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202': { $ref: '#/components/responses/NodeAccepted' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
  /devices:
    get:
      tags: [system]
      operationId: listDevices
      summary: 全ノードのハードウェア（GPU・キャプチャボード）
      description: 今の実装は自ノードだけを返す（コーデック worker が未接続なら `devices` は空）。
      x-senca-scope: node:admin
      responses:
        '200':
          description: デバイス
          headers: { X-Request-Id: { $ref: '#/components/headers/X-Request-Id' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Devices' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /grid:
    get:
      tags: [system]
      operationId: getGrid
      summary: グリッドの様子（ノードの資源・予約、仕事の割り当て）
      description: |
        配置係（ADR-0013）が見ている状態。ノードごとの申告（容量・GPU・キャプチャ機器・ラベル）と予約（割り当てた仕事の要求の和）、
        仕事ごとの割り当て・縮退の段・置けない理由。テナントで絞らない（`node:admin`）。クエリは読まない。
        `last_heartbeat` は応答したノードが配置係（リーダー）のときだけ値がある。
      x-senca-scope: node:admin
      responses:
        '200':
          description: 'グリッド'
          headers: { X-Request-Id: { $ref: '#/components/headers/X-Request-Id' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Grid' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /nodes/{id}/devices/{dev}/disable:
    parameters:
      - $ref: '#/components/parameters/NodeId'
      - $ref: '#/components/parameters/DeviceId'
    post:
      tags: [system]
      operationId: disableDevice
      summary: 装置（GPU・キャプチャ機器）を手で止める
      description: |
        グリッドの装置を手で止める（`enabled: false`。測った健康 `healthy` とは別の印）。止めた装置を使う仕事は、別の装置・ノードへ
        移るか縮退する。`placement.pin_policy: strict` でその装置に割り当てた仕事は止まったままになる。本文は読まない。
        手で止めた印は合意ログに載り、心拍・ノードの申告し直しでは戻らない（`enable` で戻すまで）。
        ノード（ID か名前）・装置がグリッドに無ければ 404。
      x-senca-scope: node:admin
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202': { $ref: '#/components/responses/DeviceHealthAccepted' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
  /nodes/{id}/devices/{dev}/enable:
    parameters:
      - $ref: '#/components/parameters/NodeId'
      - $ref: '#/components/parameters/DeviceId'
    post:
      tags: [system]
      operationId: enableDevice
      summary: 止めた装置を戻す
      description: |
        手で止めた装置を戻す（`enabled: true`）。移した・縮退した仕事は、冷却の後に戻る（`reason.code: pin_returned`・`capacity_returned`）。本文は読まない。
        ノード（ID か名前）・装置がグリッドに無ければ 404。
      x-senca-scope: node:admin
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202': { $ref: '#/components/responses/DeviceHealthAccepted' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ------------------------------------------------------------------ events
  /events:
    get:
      tags: [events]
      operationId: streamEvents
      summary: SSE のイベント購読
      description: |
        HTTP 層（`events.rs`）が扱う長く開いたままの応答。適用された制御コマンドをイベントにして、テナントで絞って流す。
        テナントを持たないイベント（`node.updated`・`stream.owner`・グリッドの `node.down`・`node.up`・`device.down`・`device.up`・`device.disabled`・
        `device.enabled`・`grid.decisions`）は `node:admin` を持つ主体にだけ流す。15 秒ごとにコメント行（keepalive）を送る。

        - SSE の `id` は制御ログの位置（applied_index）、`event` はイベントの種類、`data` は `SseEventData` の JSON。
        - 制御コマンドのイベント: `stream.created`・`stream.updated`・`stream.deleted`・`stream.owner`・`recording.updated`・`recording.deleted`・
          `schedule.created`・`schedule.updated`・`schedule.deleted`・`schedule.run`・`node.updated`・`input.updated`・`input.deleted`・
          `output.updated`・`output.deleted`・`secret.created`・`secret.deleted`・`pipeline.updated`・`pipeline.deleted`・
          `room.updated`（部屋の作成・自動の作成・更新。`data: {auto}`）・`room.deleted`、
          `media_pipeline.updated`（メディアパイプラインの作成・更新。`data: {room, desired_state}`）・`media_pipeline.deleted`、グリッドの `node.down`・`node.up`・`device.*`・`grid.decisions`（`resource_id` は空、`data: {decisions}`）。
        - **部屋の核の出来事**（ADR-0015。合意ログに載らず、部屋を置いたノードの購読者にだけ流れる）: `room.started`（部屋の核が部屋を開いた）・`room.stopped`・
          `room.connection.created`・`room.connection.updated`・`room.connection.destroyed`・`room.track.published`・`room.track.unpublished`・`room.spotlight.changed`。
          これらは SSE の `id` を持たない（`Last-Event-ID` の再開の対象外、取りこぼしは黙って飛ばす）。`data` に `event_id`（出来事の ID）と `node`（ノードの ID）があり、
          `data.data` は出来事の中身（部屋の核の `data`）。テナントで絞り、`node:admin` でも他テナントのものは流さない。
          部屋を消したとき（`DELETE /rooms/{id}`・自動の部屋の掃除）も `room.stopped` と、そのとき切った参加者の `room.connection.destroyed` が流れる。
        - `Last-Event-ID` が今の位置より前なら、最初に `event: resync`（`id` は今の位置、`data: {}`）を送る（保持を持たないので必ず再同期になる）。
        - 取りこぼし（購読の遅れ）では `event: resync`（`data: {}`）を送って閉じる。

        仕様との差: 制御のイベントの `data` に `event_id`・`generation` の欄は無い（`event_id` は SSE の `id`）。`occurred_at` は送った時刻。保持期間 24 時間の再送は無い。
        401・403 は他の API と同じ problem+json。
      x-senca-scope: stream:read
      parameters:
        - name: Last-Event-ID
          in: header
          required: false
          description: 最後に受け取ったイベントの `id`（整数）。
          schema: { type: string }
      responses:
        '200':
          description: イベントの列
          content:
            text/event-stream:
              schema:
                type: string
                description: |
                  例:
                  ```
                  event: stream.created
                  id: 42
                  data: {"type":"stream.created","resource_id":"...","occurred_at":"...","data":{"name":"studio-a"}}

                  event: room.connection.created
                  data: {"type":"room.connection.created","resource_id":"daily","event_id":"...","node":"...","occurred_at":"...","data":{"type":"connection.created","data":{"participant":{...}}}}
                  ```
              x-senca-event-data: { $ref: '#/components/schemas/SseEventData' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  # ------------------------------------------------------------------ streams
  /streams:
    post:
      tags: [streams]
      operationId: createStream
      summary: 配信定義の作成
      description: |
        `ingest.stream_key` はこの応答と `POST /streams/{id}/keys` の応答でだけ渡す（再送の応答では `null` と `stream_key_redacted: true`）。
        name は テナント内で一意（重複は 409）。stream 数の上限（1000/テナント）を超えると 403（`QUOTA_EXCEEDED`）。
        仕様との差: 仕様 10.3 の `input`・`outputs`・`transform` は本文に無い（push の入力は RTMP/SRT/WHIP、pull の入力・外部への出力は `POST /streams/{id}/inputs`・`/outputs`、変換は `/pipelines`）。
        `captions` を書くと、配信中に音声を外部の音声認識（と翻訳）へ送り、ライブ HLS に WebVTT の字幕（`master.m3u8`・`sub_{lang}.m3u8`）を足す。書かなければ外部へは何も送らない。
      x-senca-scope: stream:write
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StreamCreate' }
      responses:
        '201':
          description: 作成した
          headers:
            Location: { $ref: '#/components/headers/Location' }
            ETag: { $ref: '#/components/headers/ETagNotOnReplay' }
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
            Idempotency-Replayed: { $ref: '#/components/headers/Idempotency-Replayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Stream' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '500': { $ref: '#/components/responses/InternalError' }
    get:
      tags: [streams]
      operationId: listStreams
      summary: 配信の一覧
      x-senca-scope: stream:read
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: 配信の一覧
          headers: { X-Request-Id: { $ref: '#/components/headers/X-Request-Id' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StreamList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /streams/{id}:
    parameters:
      - $ref: '#/components/parameters/StreamId'
    get:
      tags: [streams]
      operationId: getStream
      summary: desired / observed 状態の取得
      x-senca-scope: stream:read
      responses:
        '200': { $ref: '#/components/responses/StreamOk' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [streams]
      operationId: patchStream
      summary: 設定の更新
      description: |
        書いたフィールドだけを置き換える（JSON Merge Patch の簡易版。`snapshots: null` で静止画の方針を、`captions: null` で字幕を消す。`captions` は丸ごと置き換える）。`desired_state: stopped` で publish を拒否する。
        **仕様との差: 202 ではなく 200**（その場で反映した Stream を返す）。
      x-senca-scope: stream:write
      parameters:
        - $ref: '#/components/parameters/IfMatchRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StreamPatch' }
      responses:
        '200': { $ref: '#/components/responses/StreamOk' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      tags: [streams]
      operationId: deleteStream
      summary: 配信の削除
      description: |
        stream とその予約を消す（録画は消さない、仕様 10.2）。publish 中なら切る。
        **仕様との差: 202 ではなく 204**（非同期の operation は無い）。
      x-senca-scope: stream:write
      parameters:
        - $ref: '#/components/parameters/IfMatchOptional'
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '500': { $ref: '#/components/responses/InternalError' }
  /streams/{id}/keys:
