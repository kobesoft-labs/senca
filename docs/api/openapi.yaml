      summary: API トークンの発行
      description: |
        値（`token`。`senca_` で始まります）はこの応答でだけ返します（再送に対する応答では `null` になり、`token_redacted: true` が付きます）。
        自分が持っていない権限を付けることはできません（403）。トークン数の上限（テナントあたり 100）を超えると 403（`QUOTA_EXCEEDED`）です。
      x-senca-scope: tenant:admin
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TokenCreate' }
      responses:
        '201':
          description: 発行しました
          headers:
            Location: { $ref: '#/components/headers/Location' }
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
            Idempotency-Replayed: { $ref: '#/components/headers/Idempotency-Replayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Token' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '500': { $ref: '#/components/responses/InternalError' }
    get:
      tags: [tokens]
      operationId: listTokens
      summary: API トークンの一覧（値は含まない）
      x-senca-scope: tenant:admin
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: トークンの一覧
          headers: { X-Request-Id: { $ref: '#/components/headers/X-Request-Id' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /tokens/{id}:
    parameters:
      - $ref: '#/components/parameters/TokenId'
    get:
      tags: [tokens]
      operationId: getToken
      summary: API トークンの取得（値は返さない）
      x-senca-scope: tenant:admin
      responses:
        '200':
          description: トークン（`token` は常に null）
          content:
            application/json: { schema: { $ref: '#/components/schemas/Token' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
