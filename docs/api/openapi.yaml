      x-senca-scope: stream:write
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '202':
          description: 停止を受け付けた
          headers: { X-Request-Id: { $ref: '#/components/headers/X-Request-Id' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Recording' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }
  /recordings/{id}/playback-url:
    parameters:
      - $ref: '#/components/parameters/RecordingId'
    post:
      tags: [recordings]
      operationId: createRecordingPlaybackUrl
      summary: VOD 再生の署名付き URL
      description: 本文は省略できる。`playback.mp4` は今は常に `null`（MP4 は `GET /recordings/{id}/export.mp4`）。
      x-senca-scope: recording:read
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlaybackRequest' }
      responses:
        '200':
          description: 再生 URL
          headers: { X-Request-Id: { $ref: '#/components/headers/X-Request-Id' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VodPlayback' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
  /recordings/{id}/thumbnail:
    parameters:
      - $ref: '#/components/parameters/RecordingId'
    get:
      tags: [recordings]
      operationId: getRecordingThumbnail
      summary: 録画の代表画
      description: 録画の確定後に作る。まだ無ければ 404。
      x-senca-scope: recording:read
      responses:
        '200':
          description: JPEG
          headers: { X-Request-Id: { $ref: '#/components/headers/X-Request-Id' } }
          content:
            image/jpeg: { schema: { type: string, contentMediaType: image/jpeg } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /recordings/{id}/export.mp4:
    parameters:
      - $ref: '#/components/parameters/RecordingId'
    get:
      tags: [recordings]
      operationId: exportRecordingMp4
      summary: MP4 書き出し
      description: '録画中・空の録画は 409。大きすぎれば 413（`PAYLOAD_TOO_LARGE`）。`Content-Disposition: attachment` が付く。'
      x-senca-scope: recording:read
      responses:
        '200':
          description: MP4
          headers:
            Content-Disposition: { schema: { type: string } }
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
          content:
            video/mp4: { schema: { type: string, contentMediaType: video/mp4 } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ------------------------------------------------------------------ schedules
  /schedules:
    post:
      tags: [schedules]
      operationId: createSchedule
      summary: 予約の作成
      description: |
        検査（`POST /schedules/check` と同じ）に通れば作る。窓は 24 時間まで、`end_at` は未来。
        同じ stream の録画予約が同時 4 本を超えると 409（`details.overlaps` に重なる予約）。stream が無ければ 404。
        予約数の上限（1000/テナント）を超えると 403（`QUOTA_EXCEEDED`）。
      x-senca-scope: stream:write
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScheduleCreate' }
      responses:
        '201':
          description: 作成した
          headers:
            Location: { $ref: '#/components/headers/Location' }
            ETag: { $ref: '#/components/headers/ETagNotOnReplay' }
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
            Idempotency-Replayed: { $ref: '#/components/headers/Idempotency-Replayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Schedule' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '500': { $ref: '#/components/responses/InternalError' }
    get:
      tags: [schedules]
      operationId: listSchedules
      summary: 予約の一覧
      description: '`state` は受け付けるが絞り込みに使わない（実装の不備）。'
      x-senca-scope: stream:read
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/StreamFilter'
        - $ref: '#/components/parameters/StateIgnored'
      responses:
        '200':
          description: 予約の一覧
          headers: { X-Request-Id: { $ref: '#/components/headers/X-Request-Id' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScheduleList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /schedules/check:
    post:
      tags: [schedules]
      operationId: checkSchedule
      summary: 作成前の検査（重なり・資源・競合、副作用なし）
      description: 作成と同じ本文。通れば 200、だめなら作成と同じ 400 / 404 / 409。
      x-senca-scope: stream:read
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScheduleCreate' }
      responses:
        '200':
          description: 検査結果
          headers: { X-Request-Id: { $ref: '#/components/headers/X-Request-Id' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScheduleCheck' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '500': { $ref: '#/components/responses/InternalError' }
  /schedules/{id}:
    parameters:
      - $ref: '#/components/parameters/ScheduleId'
    get:
      tags: [schedules]
      operationId: getSchedule
      summary: 予約の取得
      x-senca-scope: stream:read
      responses:
        '200': { $ref: '#/components/responses/ScheduleOk' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [schedules]
      operationId: patchSchedule
      summary: 予約の更新・取り消し
      description: |
        実行中の予約の `start_at` は変えられない（409）。`state` は `canceled` だけ指定できる。取り消し以外は作成と同じ検査をする。
        `recurrence`・`action`・`stream` は変えられない。`snapshot_interval_secs`・`retention_days` は消せない（null は「変えない」）。
      x-senca-scope: stream:write
      parameters:
        - $ref: '#/components/parameters/IfMatchRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SchedulePatch' }
      responses:
        '200': { $ref: '#/components/responses/ScheduleOk' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      tags: [schedules]
      operationId: deleteSchedule
      summary: 予約の削除
      x-senca-scope: stream:write
      parameters:
        - $ref: '#/components/parameters/IfMatchOptional'
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '500': { $ref: '#/components/responses/InternalError' }
  /schedules/{id}/runs:
    parameters:
      - $ref: '#/components/parameters/ScheduleId'
    get:
      tags: [schedules]
      operationId: listScheduleRuns
      summary: 実行履歴と結果
      description: 直近 100 件。ページングは無い（`items` だけ）。
      x-senca-scope: stream:read
      responses:
        '200':
          description: 実行履歴
          headers: { X-Request-Id: { $ref: '#/components/headers/X-Request-Id' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScheduleRunList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ------------------------------------------------------------------ tokens
  /tokens:
    post:
      tags: [tokens]
      operationId: createToken
      summary: API トークンの発行
      description: |
        値（`token`、`senca_` で始まる）はこの応答でだけ渡す（再送の応答では `null` と `token_redacted: true`）。
        自分が持っていない権限は渡せない（403）。トークン数の上限（100/テナント）を超えると 403（`QUOTA_EXCEEDED`）。
        注意: `Location` は `/api/v1/tokens/{id}` を指すが、`GET /tokens/{id}` は無い（405）。
      x-senca-scope: tenant:admin
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TokenCreate' }
      responses:
        '201':
          description: 発行した
          headers:
            Location: { $ref: '#/components/headers/Location' }
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
            Idempotency-Replayed: { $ref: '#/components/headers/Idempotency-Replayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Token' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '500': { $ref: '#/components/responses/InternalError' }
    get:
      tags: [tokens]
      operationId: listTokens
      summary: API トークンの一覧（値は含まない）
      x-senca-scope: tenant:admin
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: トークンの一覧
          headers: { X-Request-Id: { $ref: '#/components/headers/X-Request-Id' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /tokens/{id}:
    parameters:
      - $ref: '#/components/parameters/TokenId'
    get:
      tags: [tokens]
      operationId: getToken
      summary: API トークンの取得（値は返さない）
      x-senca-scope: tenant:admin
      responses:
        '200':
          description: トークン（`token` は常に null）
          content:
            application/json: { schema: { $ref: '#/components/schemas/Token' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [tokens]
      operationId: deleteToken
      summary: API トークンの失効
      description: テナントの最後の `tenant:admin` トークンは消せない（409）。
      x-senca-scope: tenant:admin
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ------------------------------------------------------------------ inputs / outputs
  /streams/{id}/inputs:
    parameters:
      - $ref: '#/components/parameters/StreamId'
    post:
      tags: [io]
      operationId: createInput
      summary: 入力（pull）の追加
      description: |
        外部から取りに行く入力を stream に足す（`rtmp_pull`・`rtsp_pull`・`srt_pull`・`hls_pull`）、またはこのノードのキャプチャ機器（`device`、`url: device:{機器 ID}`、機器は `GET /devices` の `capture`）。push（送り手がつなぐ）は stream の鍵で受けるのでここには無い。
        検査の順: 本文の形（400・415）→ stream があるか（404）→ `protocol`（400）→ `url` のスキームと形（400、資格情報 `user:pass@` は拒否して `credential_ref` を求める）→ `credential_ref`（`secret:{name}` の形と、秘密値があるか、400）→ `options`（400）→ `placement`（400、`PlacementSpec`）。
        配置: `enabled: true` の入力はグリッドの仕事（`input:{id}`）になり、配置係が割り当てたノードが実行する（`placement_status`）。`placement.node` はノードの ID か名前で、応答では ID に直る。`placement.degrade` は 400（パイプラインだけ）。
        宛先の IP（リンクローカル・プライベートなど、`--egress-allow` に無いもの）は接続時に拒否し、`status.state` は `error`/`backoff`、`status.last_error` に理由が出る（作成そのものは 201）。
        1 つの stream の入力は 4 つまで（超えると 403 `QUOTA_EXCEEDED`）。`enabled: true` ならすぐに実行を始める（応答の `status` は null か `starting` のことがある）。
      x-senca-scope: stream:write
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InputCreate' }
      responses:
        '201':
          description: 作成した
          headers:
            Location: { $ref: '#/components/headers/Location' }
            ETag: { $ref: '#/components/headers/ETagNotOnReplay' }
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
            Idempotency-Replayed: { $ref: '#/components/headers/Idempotency-Replayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Input' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '500': { $ref: '#/components/responses/InternalError' }
    get:
      tags: [io]
      operationId: listInputs
      summary: stream の入力の一覧
      x-senca-scope: stream:read
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: 入力の一覧
          headers: { X-Request-Id: { $ref: '#/components/headers/X-Request-Id' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InputList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /inputs/{id}:
    parameters:
      - $ref: '#/components/parameters/InputId'
    get:
      tags: [io]
      operationId: getInput
      summary: 入力の定義と実行の様子
      x-senca-scope: stream:read
      responses:
        '200':
          description: 入力
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Input' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [io]
      operationId: patchInput
      summary: 入力の更新
      description: |
        `url`・`credential_ref`（null で外す）・`enabled`・`options`・`placement`（null で外す）を置き換える。`protocol` と `stream` は変えられない。作成と同じ検査をする。
        更新すると実行中の接続を作り直す。`placement` を変えると配置し直す（別のノードへ移ることがある）。
      x-senca-scope: stream:write
      parameters:
        - $ref: '#/components/parameters/IfMatchRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IoPatch' }
      responses:
        '200':
          description: 更新した入力
          headers:
            ETag: { $ref: '#/components/headers/ETag' }
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Input' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      tags: [io]
      operationId: deleteInput
      summary: 入力の削除
      description: 実行中の接続を止めて定義を消す。`If-Match` は読まない。
      x-senca-scope: stream:write
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '500': { $ref: '#/components/responses/InternalError' }
  /streams/{id}/outputs:
    parameters:
      - $ref: '#/components/parameters/StreamId'
    post:
      tags: [io]
      operationId: createOutput
      summary: 出力（push・PaaS 連携）の追加
      description: |
        stream を外部へ送る出力を足す（`rtmp_push`・`srt_push`・`paas`、REQ-001）。配信が始まるまでは `status.state: waiting_input`。
        - `rtmp_push`・`srt_push`: `url` が要る（スキームの検査と、資格情報 `user:pass@` の拒否は入力と同じ）。RTMP の stream key は `url` の最後か `credential_ref`。
        - `paas`: `provider`（`cloudflare_stream`・`aws_ivs`・`aws_medialive`）と `credential_ref`（その API の資格情報）が要る。`url` は使わない。SENCA が外部に作った資源は `provider_resource` に入り、出力の削除で後片付けする。
        1 つの stream の出力は 16 個まで（超えると 403 `QUOTA_EXCEEDED`）。
        配置: `enabled: true` の出力はグリッドの仕事（`output:{id}`）になり、配置係が割り当てたノードが送り出す（`placement_status`。指定が無ければ配信を受けたノードを好む）。`placement` の検査は入力と同じ（`degrade` は 400）。
        `whip_push`（外部の WHIP サーバーへ送る）はまだ無い（400）。
      x-senca-scope: stream:write
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OutputCreate' }
      responses:
        '201':
          description: 作成した
          headers:
            Location: { $ref: '#/components/headers/Location' }
            ETag: { $ref: '#/components/headers/ETagNotOnReplay' }
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
            Idempotency-Replayed: { $ref: '#/components/headers/Idempotency-Replayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Output' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '500': { $ref: '#/components/responses/InternalError' }
    get:
      tags: [io]
      operationId: listOutputs
      summary: stream の出力の一覧
      x-senca-scope: stream:read
