      operationId: startRecording
      summary: 録画の開始
      description: |
        Recording を作って 202 で返す（`Location` は `/api/v1/recordings/{id}`）。本文は省略できる。
        stream が `stopped` なら 409。同じ stream の同時録画が 8 本なら 403（`QUOTA_EXCEEDED`）。
        仕様との差: operation 資源ではなく Recording を返す。
      x-senca-scope: stream:write
