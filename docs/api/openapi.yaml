        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '413': { $ref: '#/components/responses/PayloadTooLarge' }
        '500': { $ref: '#/components/responses/InternalError' }

  # ------------------------------------------------------------------ schedules
  /schedules:
    post:
      tags: [schedules]
      operationId: createSchedule
      summary: 予約の作成
      description: |
        検査（`POST /schedules/check` と同じ）に通れば作成します。期間は 24 時間までで、`end_at` は未来の時刻である必要があります。
        同じ stream の録画予約が同時に 4 本を超えると 409 です（`details.overlaps` に重なる予約が入ります）。stream が無ければ 404 です。
        予約数の上限（テナントあたり 1000）を超えると 403（`QUOTA_EXCEEDED`）です。
      x-senca-scope: stream:write
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScheduleCreate' }
      responses:
        '201':
          description: 作成しました
          headers:
            Location: { $ref: '#/components/headers/Location' }
            ETag: { $ref: '#/components/headers/ETagNotOnReplay' }
            X-Request-Id: { $ref: '#/components/headers/X-Request-Id' }
            Idempotency-Replayed: { $ref: '#/components/headers/Idempotency-Replayed' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Schedule' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '500': { $ref: '#/components/responses/InternalError' }
    get:
      tags: [schedules]
      operationId: listSchedules
      summary: 予約の一覧
      description: '`state` クエリパラメーターは受け付けますが、絞り込みには使いません。'
      x-senca-scope: stream:read
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/StreamFilter'
        - $ref: '#/components/parameters/StateIgnored'
      responses:
        '200':
          description: 予約の一覧
          headers: { X-Request-Id: { $ref: '#/components/headers/X-Request-Id' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScheduleList' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /schedules/check:
    post:
      tags: [schedules]
      operationId: checkSchedule
      summary: 作成前の検査（重なり・資源・競合。副作用なし）
      description: 作成と同じ本文を送ります。検査に通れば 200、通らなければ作成と同じ 400 / 404 / 409 を返します。
      x-senca-scope: stream:read
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScheduleCreate' }
      responses:
        '200':
          description: 検査結果
          headers: { X-Request-Id: { $ref: '#/components/headers/X-Request-Id' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScheduleCheck' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '500': { $ref: '#/components/responses/InternalError' }
  /schedules/{id}:
    parameters:
      - $ref: '#/components/parameters/ScheduleId'
    get:
      tags: [schedules]
      operationId: getSchedule
      summary: 予約の取得
      x-senca-scope: stream:read
      responses:
        '200': { $ref: '#/components/responses/ScheduleOk' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [schedules]
      operationId: patchSchedule
      summary: 予約の更新・取り消し
      description: |
        実行中の予約の `start_at` は変更できません（409）。`state` には `canceled` だけを指定できます。取り消し以外の変更には作成と同じ検査を行います。
        `recurrence`・`action`・`stream` は変更できません。`snapshot_interval_secs`・`retention_days` は削除できません（null は「変更しない」の意味です）。
      x-senca-scope: stream:write
      parameters:
        - $ref: '#/components/parameters/IfMatchRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SchedulePatch' }
      responses:
        '200': { $ref: '#/components/responses/ScheduleOk' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
        '500': { $ref: '#/components/responses/InternalError' }
    delete:
      tags: [schedules]
      operationId: deleteSchedule
      summary: 予約の削除
      x-senca-scope: stream:write
      parameters:
        - $ref: '#/components/parameters/IfMatchOptional'
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '500': { $ref: '#/components/responses/InternalError' }
  /schedules/{id}/runs:
    parameters:
      - $ref: '#/components/parameters/ScheduleId'
    get:
      tags: [schedules]
      operationId: listScheduleRuns
      summary: 実行履歴と結果
      description: 直近の 100 件です。ページングはありません（`items` だけを返します）。
      x-senca-scope: stream:read
      responses:
        '200':
          description: 実行履歴
          headers: { X-Request-Id: { $ref: '#/components/headers/X-Request-Id' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScheduleRunList' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ------------------------------------------------------------------ tokens
