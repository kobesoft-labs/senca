    delete:
      tags: [io]
      operationId: deleteOutput
      summary: 出力の削除
      description: |
        送出を止めて定義を消す。`paas` で SENCA が外部に作った資源は後片付けする（失敗してもログに残して定義は消す）。`If-Match` は読まない。
      x-senca-scope: stream:write
      responses:
        '204': { $ref: '#/components/responses/NoContent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
