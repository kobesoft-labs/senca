[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.2"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.90"
repository = "https://github.com/kobesoft-labs/senca"

[workspace.dependencies]
bytes = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros", "fs", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
base64 = "0.22"
subtle = "2"
getrandom = "0.3"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# パスワードのハッシュ（Argon2id）は最適化なしだと 1 回に数秒かかる。開発用のビルドでも最適化する
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

[profile.release]
debug = 1
lto = "thin"
codegen-units = 4
