[package]
name = "senca-tls"
description = "Sans-io TLS 1.3 (RFC 8446) client/server with QUIC (RFC 9001) mode for SENCA"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
sha2.workspace = true
subtle.workspace = true
getrandom.workspace = true
hmac = "0.12"
hkdf = "0.12"
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc", "zeroize"] }
# AES の鍵展開も破棄時にゼロで埋める（feature を有効にするためだけの依存）。
aes = { version = "0.8", features = ["zeroize"] }
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "ecdh", "pkcs8", "std"] }
p384 = { version = "0.13", default-features = false, features = ["ecdsa", "std"] }
x25519-dalek = { version = "2", default-features = false, features = ["zeroize", "static_secrets"] }
ed25519-dalek = { version = "2", default-features = false, features = ["std", "pkcs8"] }
rsa = { version = "0.9", default-features = false, features = ["std", "sha2", "u64_digit"] }
webpki = { package = "rustls-webpki", version = "0.103", default-features = false, features = ["std"] }
pki-types = { package = "rustls-pki-types", version = "1", features = ["std"] }
zeroize = "1"

[lints]
workspace = true
