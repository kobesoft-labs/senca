[package]
name = "senca-capture"
description = "Capture device adapters (V4L2, ALSA, Blackmagic DeckLink, synthetic) and the isolated capture worker for SENCA"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "senca-capture-worker"
path = "src/bin/senca-capture-worker.rs"

[dependencies]
senca-core = { path = "../senca-core" }
senca-codec = { path = "../senca-codec" }
senca-codec-worker = { path = "../senca-codec-worker" }
senca-image = { path = "../senca-image" }
bytes.workspace = true
serde.workspace = true
serde_json.workspace = true
libc = "0.2"
libloading = "0.9"
tokio = { workspace = true, features = ["process", "rt", "io-util", "time", "sync", "macros"] }

[dev-dependencies]
senca-fmp4 = { path = "../senca-fmp4" }
tokio = { workspace = true, features = ["process", "rt", "rt-multi-thread", "io-util", "time", "sync", "macros"] }

[lints]
workspace = true
