# SENCA の coverage-guided fuzz（cargo-fuzz / libFuzzer）。仕様 15.3・AC-01。
# ワークスペースの外に置く（nightly と sanitizer の設定を本体の build に持ち込まない）。
# 使い方は docs/dev/RELEASE.md の「fuzz」。
[package]
name = "senca-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license = "Apache-2.0"

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
libfuzzer-sys = "0.4"
bytes = "1"
base64 = "0.22"
ed25519-dalek = "2"
senca-core = { path = "../crates/senca-core" }
senca-amf0 = { path = "../crates/senca-amf0" }
senca-flv = { path = "../crates/senca-flv" }
senca-rtmp = { path = "../crates/senca-rtmp" }
senca-mpegts = { path = "../crates/senca-mpegts" }
senca-fmp4 = { path = "../crates/senca-fmp4" }
senca-hls = { path = "../crates/senca-hls" }
senca-http = { path = "../crates/senca-http" }
senca-sdp = { path = "../crates/senca-sdp" }
senca-stun = { path = "../crates/senca-stun" }
senca-rtp = { path = "../crates/senca-rtp" }
senca-rtsp = { path = "../crates/senca-rtsp" }
senca-srt = { path = "../crates/senca-srt" }
senca-dtls = { path = "../crates/senca-dtls" }
senca-h264 = { path = "../crates/senca-h264" }
senca-h265 = { path = "../crates/senca-h265" }
senca-aac = { path = "../crates/senca-aac" }
senca-av1 = { path = "../crates/senca-av1" }
senca-opus = { path = "../crates/senca-opus" }
senca-record = { path = "../crates/senca-record" }
senca-control = { path = "../crates/senca-control" }
senca-image = { path = "../crates/senca-image" }
senca-raft = { path = "../crates/senca-raft" }
senca-tls = { path = "../crates/senca-tls" }

[profile.release]
debug = 1


[[bin]]
name = "amf0"
path = "fuzz_targets/amf0.rs"
test = false
doc = false
bench = false

